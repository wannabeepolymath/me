<style>
/*
  One object: a shortwave receiver. The viewport is its dial glass.
  A fixed red needle, a printed scale that slides under it, and signal strength
  deciding how legible the programme is. Everything else is cabinet.
*/
:root {
  --bakelite: #2a1410;
  --bakelite-2: #40201a;
  --glass-edge: #8f6120;
  --glass: #e9bd52;
  --glass-hot: #fbe39a;
  --print: #1b100a;
  --print-soft: rgba(27, 16, 10, .72);
  --needle: #d7331c;
  --brass: #c99a3b;
  --brass-2: #8a6420;
  --eye: #8fe8a0;
  --eye-dark: #0b2214;
  --dial: "Big Shoulders Display", Oswald, "Arial Narrow", Impact, sans-serif;
  --copy: Spectral, Georgia, "Times New Roman", serif;
  --name: clamp(64px, min(12.5vw, 22vh), 196px);   /* station print size; the scale is derived from it */
  --k: calc(var(--name) / 50);         /* px per kHz */
  --frame: clamp(10px, 1.4vw, 18px);
  --pad: clamp(18px, 3vw, 44px);
  --sig: 0;                            /* 0 static .. 1 locked, set by script */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bakelite); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; padding: var(--frame);
  display: grid; grid-template-rows: auto 1fr auto; gap: calc(var(--frame) * .8);
  background: radial-gradient(140% 100% at 50% 0%, var(--bakelite-2), var(--bakelite) 70%);
  color: var(--print); font: 400 1.0625rem/1.5 var(--copy); -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, p, dl, dd, dt, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration-thickness: 1.5px; text-underline-offset: .18em; }
a:hover { color: var(--needle); }
:focus-visible { outline: 3px solid var(--needle); outline-offset: 4px; border-radius: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* ---------- cabinet top: nameplate, magic eye, sound knob ---------- */
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 .25rem; }
.plate {
  display: inline-grid; padding: .5rem .9rem .55rem; border-radius: 3px;
  background: linear-gradient(170deg, #e2b85a, var(--brass) 45%, var(--brass-2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.5);
  color: #2a1a08; text-shadow: 0 1px 0 rgba(255,235,180,.45);
}
.plate h1 { font: 900 1.25rem/1 var(--dial); letter-spacing: .09em; text-transform: uppercase; }
.plate small { font: 700 .72rem/1 var(--dial); letter-spacing: .14em; text-transform: uppercase; margin-top: .3rem; opacity: .8; }
.controls { display: flex; align-items: center; gap: 1.1rem; }
#eye {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: conic-gradient(from calc(var(--gap) / -2), var(--eye-dark) var(--gap), var(--eye) 0);
  --gap: calc((1 - var(--sig)) * 150deg);
  box-shadow: 0 0 0 3px #1a0c08, 0 0 0 5px var(--brass-2), 0 0 18px rgba(143,232,160,calc(var(--sig) * .7)), inset 0 0 8px rgba(0,0,0,.6);
}
#snd {
  display: flex; align-items: center; gap: .6rem; padding: 0; border: 0; background: none; cursor: pointer;
  color: #e8cf96; font: 700 .8rem/1 var(--dial); letter-spacing: .12em; text-transform: uppercase;
}
#snd .knob {
  width: 34px; height: 34px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 35% 30%, #5a3024, #22100c 70%);
  box-shadow: 0 0 0 2px var(--brass-2), 0 3px 6px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.15);
  transition: transform .4s cubic-bezier(.3,1.4,.5,1);
}
#snd .knob::after { content: ""; position: absolute; left: 50%; top: 4px; width: 3px; height: 11px; margin-left: -1.5px; background: #e8cf96; border-radius: 2px; }
#snd[aria-pressed="true"] .knob { transform: rotate(135deg); }
#snd span.on { display: none; }
#snd[aria-pressed="true"] span.on { display: inline; }
#snd[aria-pressed="true"] span.off { display: none; }

/* ---------- the dial glass ---------- */
#glass {
  position: relative; overflow: hidden; overflow: clip; border-radius: 16px; min-height: 420px;
  background: radial-gradient(120% 95% at 50% 42%, var(--glass-hot) 0%, var(--glass) 36%, var(--glass-edge) 100%);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.45), inset 0 14px 42px rgba(60,30,0,.45), inset 0 -24px 70px rgba(60,30,0,.4), 0 0 0 1px #140906;
  cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: filter 1.6s ease-out;
}
#glass.cold { filter: brightness(.3) saturate(.6); }
#glass.dragging { cursor: grabbing; }
#glass::before { /* reflection on the pane */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
  background: linear-gradient(178deg, rgba(255,255,255,.22), rgba(255,255,255,0) 18%, rgba(255,255,255,0) 86%, rgba(255,255,255,.06));
}
#lamp { /* the dial lamp sits behind the needle; it brightens as the signal locks */
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(40% 70% at 50% 35%, rgba(255,246,205,.9), rgba(255,240,180,0) 100%);
  opacity: calc(var(--sig) * .85);
}
#noise { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; image-rendering: pixelated; opacity: var(--noise, 0); z-index: 3; }

#strip { position: absolute; top: clamp(14px, 2.6vh, 26px); left: 0; will-change: transform; z-index: 2; }
.ruler { position: relative; height: 48px; }
.ruler::before, .ruler::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; }
.ruler::before { height: 9px; background: repeating-linear-gradient(90deg, var(--print) 0 1.5px, transparent 1.5px calc(var(--k) * 10)); background-position: calc(var(--off, 0) * var(--k) - .75px) 0; opacity: .7; }
.ruler::after  { height: 20px; background: repeating-linear-gradient(90deg, var(--print) 0 2px, transparent 2px calc(var(--k) * 50)); background-position: calc(var(--off, 0) * var(--k) - 1px) 0; }
.ruler span { position: absolute; bottom: 24px; transform: translateX(-50%); font: 700 clamp(13px, 1.1vw, 17px)/1 var(--dial); letter-spacing: .05em; color: var(--print); }
.ruler .unit { bottom: 26px; font-weight: 900; opacity: .7; }
.ruler .paw { bottom: 23px; width: 14px; height: 14px; background:
  radial-gradient(circle at 50% 72%, var(--print) 36%, transparent 38%),
  radial-gradient(circle at 18% 36%, var(--print) 14%, transparent 16%),
  radial-gradient(circle at 40% 18%, var(--print) 14%, transparent 16%),
  radial-gradient(circle at 62% 18%, var(--print) 14%, transparent 16%),
  radial-gradient(circle at 84% 36%, var(--print) 14%, transparent 16%); opacity: .55; }
.names { position: relative; height: calc(var(--name) * .95); margin-top: 4px; }
.names button {
  position: absolute; top: 0; transform: translateX(-50%) scaleX(var(--fit, 1)); padding: 0 .06em; border: 0; background: none; cursor: pointer;
  font: 900 var(--name)/1 var(--dial); letter-spacing: .01em; text-transform: uppercase; color: var(--print); white-space: nowrap;
  transition: color .25s;
}
.names button:hover { color: var(--needle); }
.names button:focus-visible { outline-offset: -3px; }

#needle { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--needle); z-index: 4; pointer-events: none;
  box-shadow: 0 0 10px rgba(215,51,28,.55), 0 0 1px rgba(0,0,0,.6); }
#needle::before { content: ""; position: absolute; top: 0; left: 50%; width: 0; height: 0; margin-left: -9px; border: 9px solid transparent; border-top: 12px solid var(--needle); }
#hint { position: absolute; left: 50%; top: calc(clamp(14px, 2.6vh, 26px) + 48px + var(--name) * .95 + 18px); transform: translateX(-50%);
  display: flex; align-items: center; gap: .45rem; font: italic 400 .95rem/1 var(--copy); color: var(--print-soft); pointer-events: none; z-index: 5;
  transition: opacity .6s; white-space: nowrap; }
#hint.gone { opacity: 0; }
#hint svg { width: 34px; height: 10px; }

#programme { position: absolute; left: var(--pad); right: var(--pad); bottom: var(--pad); z-index: 5; cursor: auto; user-select: text; -webkit-user-select: text;
  max-height: calc(100% - clamp(14px, 2.6vh, 26px) - 48px - var(--name) * .95 - 52px); overflow-y: auto; overscroll-behavior: contain;
  opacity: calc(.08 + var(--sig) * .92); }
.station { display: none; max-width: 40rem; }
.station.on { display: grid; gap: 1rem; }
.station .freq { font: 700 .9rem/1 var(--dial); letter-spacing: .14em; text-transform: uppercase; color: var(--print-soft); }
.station h2 { font: 400 clamp(1.75rem, 3.3vw, 3rem)/1.06 var(--copy); letter-spacing: -.012em; text-wrap: balance; }
.station p { font-size: clamp(1.0625rem, 1.35vw, 1.25rem); color: var(--print-soft); text-wrap: pretty; max-width: 34rem; }
.station p b { font-weight: 500; color: var(--print); }
.station dl { display: grid; gap: .35rem .9rem; }
.station dl > div { display: grid; grid-template-columns: max-content 1fr; align-items: baseline; gap: .6rem; }
.station dt { font-weight: 500; }
.station dl > div::before { content: ""; order: 1; align-self: end; margin-bottom: .45em; border-bottom: 2px dotted rgba(27,16,10,.35); }
.station dl > div { grid-template-columns: max-content minmax(0, 1fr) max-content; }
.station dd { order: 2; font-style: italic; color: var(--print-soft); text-align: right; }
.station ul { display: grid; gap: .45rem; }
.station li { color: var(--print-soft); font-size: clamp(1.0625rem, 1.35vw, 1.25rem); }
.station li b { font-weight: 500; color: var(--print); }
.station .links { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; font-size: 1.1rem; }
.fill { font-style: italic; color: rgba(27,16,10,.55); }

/* printed station legend, bottom-right of the glass */
.legend { position: absolute; right: var(--pad); bottom: var(--pad); z-index: 5; display: grid; gap: .45rem; justify-items: end; }
.legend button { display: flex; gap: .7rem; align-items: center; border: 0; background: none; cursor: pointer; padding: .15rem .3rem;
  font: 700 .95rem/1 var(--dial); letter-spacing: .08em; text-transform: uppercase; color: var(--print-soft); }
.legend button .f { font-weight: 900; color: var(--print); min-width: 2.7em; text-align: right; }
.legend button::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--needle); opacity: 0; transition: opacity .25s; }
.legend button.live::after { opacity: 1; }
.legend button:hover { color: var(--needle); }
@media (max-width: 1000px) { .legend { display: none; } }

/* the unlisted station's cat, drawn in css */
.cat { position: relative; width: 120px; height: 72px; margin-top: .4rem; }
.cat .body { position: absolute; left: 18px; bottom: 0; width: 100px; height: 50px; border-radius: 50px 50px 10px 10px / 50px 50px 10px 10px; background: var(--print); }
.cat .head { position: absolute; left: 0; bottom: 20px; width: 50px; height: 44px; border-radius: 50%; background: var(--print); }
.cat .head::before, .cat .head::after { content: ""; position: absolute; top: -10px; border: 11px solid transparent; border-bottom: 18px solid var(--print); border-top: 0; }
.cat .head::before { left: 3px; transform: rotate(-16deg); } .cat .head::after { right: 3px; transform: rotate(16deg); }
.cat .eye { position: absolute; top: 20px; width: 7px; height: 9px; border-radius: 50%; background: var(--glass-hot); animation: blink 5s infinite; }
.cat .eye.l { left: 13px; } .cat .eye.r { left: 30px; }
.cat .tail { position: absolute; right: -6px; bottom: 6px; width: 16px; height: 56px; border-radius: 10px; background: var(--print); transform-origin: 50% 100%; animation: tail 3.2s ease-in-out infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes tail { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }

/* ---------- no JavaScript: the essentials, printed on plain glass ---------- */
.nojs { height: 100%; max-width: none; border-radius: 16px; padding: var(--pad); display: grid; align-content: end; gap: 1rem;
  background: radial-gradient(120% 95% at 50% 42%, var(--glass-hot) 0%, var(--glass) 36%, var(--glass-edge) 100%); box-shadow: inset 0 0 0 2px rgba(0,0,0,.45), 0 0 0 1px #140906; }

/* ---------- speaker grille: contact is always one glance away ---------- */
footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem 1.5rem; padding: .85rem 1rem; border-radius: 10px;
  background: radial-gradient(circle at 2px 2px, #0f0604 1.6px, transparent 1.8px) 0 0 / 7px 7px, #35190f; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  color: #e8cf96; font: 400 .95rem/1 var(--copy); }
footer nav { display: flex; flex-wrap: wrap; gap: .5rem 1.6rem; }
footer a { text-decoration-color: rgba(232,207,150,.5); }
footer a:hover { color: #fff; }
footer .keys { color: rgba(232,207,150,.6); font-style: italic; }
kbd { font: 700 .72rem/1 var(--dial); letter-spacing: .06em; padding: .15em .35em; border: 1px solid rgba(232,207,150,.45); border-radius: 3px; font-style: normal; }

@media (max-width: 720px) {
  #snd .on, #snd .off { display: none !important; }
  footer .keys { display: none; }
  #needle { bottom: auto; height: calc(clamp(14px, 2.6vh, 26px) + 48px + var(--name) * .95 + 44px); }
  #programme { top: calc(clamp(14px, 2.6vh, 26px) + 48px + var(--name) * .95 + 56px); bottom: var(--pad); max-height: none; }
  .station dl > div { grid-template-columns: 1fr; gap: 0; }
  .station dl > div::before { display: none; }
  .station dd { text-align: left; }
  .station .links { flex-direction: column; gap: .4rem; }
}
@media (prefers-reduced-motion: reduce) {
  #glass, #snd .knob, #hint { transition: none; }
  .cat .eye, .cat .tail { animation: none; }
}
</style>
</head>
<body>

  <div class="plate">

<script>
/* ============ Edit me: everything personal lives here. ===================================================

   To add a station, add one entry to `stations` (any order; they're sorted by frequency):
     { f: 1300, name: "Kitchen", title: "A headline.", body: [ ...blocks ] }

   f       frequency in kHz. Printed stations read best 250+ apart (names squeeze to fit if closer).
           The dial stretches to fit whatever frequencies you use.
   name    printed on the glass and in the legend. Use `secret: true` instead for an unlisted
           station: no name, just a paw print on the scale. Highest on the dial = the End key finds it.
   title   the headline.
   body    blocks, shown in order:
             "A paragraph."                         HTML is fine: <b>, <a href="...">
             { table: [["Label", "value"], ...] }    dotted-leader list
             { list:  [["Name", "what it is"], ...] } bulleted list
             { links: [["text", "href"], ...] }
             { cat: true }                           the drawn cat
   {email} {github} {x} {name} inside any text or href are replaced with the values below.
   "[fill: ...]" renders as a faint italic placeholder until you replace it.
   The first entry is where the dial lands when someone arrives. If you add or remove a printed station,
   update the "Three more stations" line in Bangalore. The <noscript> copy in the HTML mirrors the essentials.
*/
const DAKSH = {
  name: "Daksh Jain",
  email: "dakshjainn2004@gmail.com",
  github: "https://github.com/wannabeepolymath",
  x: "https://x.com/dakshhjainn",
  stations: [
    { f: 630, name: "Bangalore", title: "You've reached {name}.", body: [
      "He lives in Bangalore and is studying computer science at BITS Pilani, a bachelor's and a master's back to back, done in 2027. He builds software, and [fill: one thing he makes that isn't software], and would rather be curious about everything than expert in one thing. The GitHub handle is <b>wannabeepolymath</b>; the wannabe is deliberate.",
      "Keep turning. Three more stations are printed on the glass. One isn't.",
    ] },
    { f: 900, name: "Curiosities", title: "The polymath programme.", body: [
      "What he's into this month, in no particular order. Schedule subject to change without notice.",
      { table: [
        ["Learning",                     "[fill: an instrument, a language, a sport]"],
        ["Reading",                      "[fill: a book, or this month's rabbit hole]"],
        ["Listening to",                 "[fill: an album on repeat]"],
        ["Can't explain why",            "[fill: an interest with no career value]"],
        ["Would talk for an hour about", "[fill: a topic]"],
      ] },
    ] },
    { f: 1170, name: "Workshop", title: "The workshop. One room of the house, not the house.", body: [
      { list: [
        ["Parla",       "a voice-dictation app for macOS"],
        ["Burmese",     "a companion cat that lives on your desktop"],
        ["Mux",         "a WebSocket multiplexer written in Rust"],
        ["Not Redis",   "a Redis clone written in Go"],
        ["Solana game", "a Telegram game that settles on-chain"],
        ["Emergent",    "a stint building backends for AI agents"],
      ] },
      "Most of it is on <a href=\"{github}\">GitHub</a>.",
    ] },
    { f: 1440, name: "Mailbag", title: "Letters, replies, and the occasional unsolicited idea.", body: [
      "Email gets read. There is no phone number, on purpose.",
      { links: [["{email}", "mailto:{email}"], ["github / wannabeepolymath", "{github}"], ["x / dakshhjainn", "{x}"]] },
    ] },
    { f: 1660, secret: true, title: "Unlisted.", body: [
      "You found Burmese, the cat from his desktop. It purrs on this frequency; turn the sound on to hear it.",
      { cat: true },
    ] },
  ],
};
/* ======================================================================================================== */

const sub = s => String(s).replace(/\{(\w+)\}/g, (m, k) => typeof DAKSH[k] === "string" ? DAKSH[k] : m);
const fill = s => sub(s).replace(/\[fill:[^\]]*\]/g, m => `<span class="fill">${m}</span>`);
const CAT = `<div class="cat" aria-hidden="true"><div class="tail"></div><div class="body"></div><div class="head"><div class="eye l"></div><div class="eye r"></div></div></div>`;
const block = b => typeof b === "string" ? `<p>${fill(b)}</p>`
  : b.table ? `<dl>${b.table.map(([k, v]) => `<div><dt>${fill(k)}</dt><dd>${fill(v)}</dd></div>`).join("")}</dl>`
  : b.list  ? `<ul>${b.list.map(([k, v]) => `<li><b>${fill(k)}</b>, ${fill(v)}</li>`).join("")}</ul>`
  : b.links ? `<div class="links">${b.links.map(([t, h]) => `<a href="${sub(h)}">${fill(t)}</a>`).join("")}</div>`
  : b.cat   ? CAT : "";
const HOME = DAKSH.stations.find(s => !s.secret) || DAKSH.stations[0];
const STATIONS = DAKSH.stations.map(s => ({ ...s, secret: s.secret || !s.name, html: `<h2>${fill(s.title || "")}</h2>` + (s.body || []).map(block).join("") })).sort((a, b) => a.f - b.f);
const fs = STATIONS.map(s => s.f);
const LO = Math.min(520, Math.floor((Math.min(...fs) - 110) / 10) * 10), HI = Math.max(1700, Math.max(...fs) + 40), BAND = 22;
const rmq = matchMedia("(prefers-reduced-motion: reduce)");
let RM = rmq.matches;
const $ = id => document.getElementById(id);
const root = document.documentElement, glass = $("glass"), strip = $("strip"), prog = $("programme"), hint = $("hint"), live = $("live");
const kbFocus = el => { try { return el.matches(":focus-visible"); } catch (_) { return true; } }; // old Safari lacks :focus-visible

/* ---------- print the scale ---------- */
const ruler = $("ruler"), names = $("names");
strip.style.width = `calc(${HI - LO} * var(--k))`;
ruler.style.setProperty("--off", (50 - LO % 50) % 50); // major ticks on round numbers
for (let f = Math.ceil((LO + 60) / 100) * 100; f < HI; f += 100) { const s = document.createElement("span"); s.textContent = f; s.style.left = `calc(${f - LO} * var(--k))`; ruler.appendChild(s); }
const unit = document.createElement("span"); unit.className = "unit"; unit.textContent = "kHz"; unit.style.left = `calc(22 * var(--k))`; ruler.appendChild(unit);
STATIONS.forEach(s => {
  s.el = document.createElement("section"); s.el.className = "station"; s.el.innerHTML = `<div class="freq">${s.f} kHz${s.secret ? "" : ", " + s.name}</div>` + s.html; prog.appendChild(s.el);
  if (s.secret) { const p = document.createElement("span"); p.className = "paw"; p.style.left = `calc(${s.f - LO} * var(--k))`; ruler.appendChild(p); return; }
  const b = s.btn = document.createElement("button"); b.type = "button"; b.textContent = s.name; b.setAttribute("aria-label", `Tune to ${s.name}, ${s.f} kHz`);
  b.style.left = `calc(${s.f - LO} * var(--k))`;
  b.addEventListener("click", e => { if (!(dragged && e.detail)) tuneTo(s); }); // a drag that ends on a name is not a click
  b.addEventListener("focus", () => { if (kbFocus(b)) tuneTo(s); });            // tab onto a name = tune to it; mouse focus waits for the click
  names.appendChild(b);
});
const PRINTED = STATIONS.filter(s => !s.secret);
PRINTED.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.tabIndex = -1; b.innerHTML = `<span class="f">${s.f}</span>${s.name}`; b.addEventListener("click", () => tuneTo(s)); s.leg = b; $("legend").appendChild(b); });
$("f-mail").href = "mailto:" + DAKSH.email; $("f-gh").href = DAKSH.github; $("f-x").href = DAKSH.x;

/* ---------- tuning ---------- */
let freq = RM ? HOME.f : Math.max(LO, HOME.f - 82), target = null, vel = 0, dragging = false, dragged = false, k = 3, cx = 0, current = null, locked = null, moved = false;
const signalOf = f => Math.max(...STATIONS.map(s => Math.exp(-(((f - s.f) / BAND) ** 2))));
const nearest = f => STATIONS.reduce((a, s) => Math.abs(s.f - f) < Math.abs(a.f - f) ? s : a);
const clamp = f => Math.min(HI, Math.max(LO, f));
function measure() {
  const b = names.firstElementChild; k = b ? parseFloat(getComputedStyle(b).fontSize) / 50 || 3 : 3; cx = glass.clientWidth / 2;
  if (dragging) { px = lastX; pf = freq; } // resized mid-drag: re-anchor so the dial doesn't jump
  PRINTED.forEach((s, i) => { // squeeze a name that would collide with its neighbour (fallback font, long name, close stations)
    const gap = Math.min(i ? s.f - PRINTED[i - 1].f : 1e9, i < PRINTED.length - 1 ? PRINTED[i + 1].f - s.f : 1e9);
    s.btn.style.setProperty("--fit", Math.min(1, gap * k * .9 / s.btn.offsetWidth).toFixed(3));
  });
  sizeNoise();
}
function tuneTo(s) { target = s.f; vel = 0; usedDial(); }
function detent() { const s = nearest(freq); if (Math.abs(s.f - freq) < 18) target = s.f; }
function usedDial() { if (!moved) { moved = true; hint.classList.add("gone"); } }

/* pointer: mouse, pen and touch. Capture only once the gesture is clearly horizontal, so taps still click names and vertical swipes still scroll. */
let px = 0, py = 0, pf = 0, lastX = 0, lastT = 0, axis = null, pid = null;
glass.addEventListener("pointerdown", e => {
  if (e.button || !e.isPrimary || e.target.closest("a, #programme, .legend")) return;
  dragging = true; dragged = false; axis = null; target = null; vel = 0; pid = e.pointerId;
  px = lastX = e.clientX; py = e.clientY; pf = freq; lastT = e.timeStamp;
});
glass.addEventListener("pointermove", e => {
  if (!dragging || e.pointerId !== pid) return;
  if (!axis) {
    const dx = Math.abs(e.clientX - px), dy = Math.abs(e.clientY - py); if (dx < 6 && dy < 6) return;
    axis = dx >= dy ? "x" : "y";
    if (axis === "x") { dragged = true; try { glass.setPointerCapture(pid); } catch (_) {} glass.classList.add("dragging"); usedDial(); }
  }
  if (axis !== "x") return;
  freq = clamp(pf - (e.clientX - px) / k);
  const dt = e.timeStamp - lastT; if (dt > 0) vel = -(e.clientX - lastX) / k / dt * 16.667; lastX = e.clientX; lastT = e.timeStamp;
});
const release = e => {
  if (!dragging || e.pointerId !== pid) return;
  dragging = false; glass.classList.remove("dragging");
  if (e.timeStamp - lastT > 90) vel = 0; // held still before letting go: no fling
  if (RM || Math.abs(vel) < .4) { vel = 0; detent(); return; }
  const end = clamp(freq + vel / (1 - .93)), s = nearest(end); // a fling that would coast to just short of a station lands on it
  if (Math.abs(s.f - end) < 60) { vel = 0; target = s.f; }
};
["pointerup", "pointercancel", "lostpointercapture"].forEach(t => glass.addEventListener(t, release));
glass.addEventListener("scroll", () => { glass.scrollLeft = glass.scrollTop = 0; }); // browsers without overflow:clip scroll the glass to a focused name

/* wheel / trackpad. Firefox reports mouse wheels in lines. Vertical wheel only tunes when the page itself has nowhere to scroll. */
let wheelT;
glass.addEventListener("wheel", e => {
  if (e.ctrlKey) return; // pinch-zoom
  const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY);
  if (!horiz && ((e.target.closest("#programme") && prog.scrollHeight > prog.clientHeight + 1) || root.scrollHeight > innerHeight + 1)) return;
  const d = (horiz ? e.deltaX : e.deltaY) * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? glass.clientWidth : 1);
  e.preventDefault(); target = null; vel = 0; freq = clamp(freq + d * .18);
  usedDial(); clearTimeout(wheelT); wheelT = setTimeout(detent, 160);
}, { passive: false });

addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return; // leave Alt+Arrow (history) etc. to the browser
  const ref = target != null ? target : freq; let s;
  if (e.key === "ArrowRight") s = PRINTED.find(p => p.f > ref + 1) || PRINTED[PRINTED.length - 1];
  else if (e.key === "ArrowLeft") s = PRINTED.slice().reverse().find(p => p.f < ref - 1) || PRINTED[0];
  else if (e.key === "Home") s = PRINTED[0];
  else if (e.key === "End") s = STATIONS[STATIONS.length - 1];
  else return;
  e.preventDefault(); tuneTo(s);
  const a = document.activeElement; if (a && a.parentNode === names && s.btn) s.btn.focus({ preventScroll: true }); // keep focus on the tuned name
});

/* ---------- static ---------- */
const nc = $("noise"), nx = nc.getContext("2d", { alpha: false });
let nw = 0, nh = 0, img, buf;
function sizeNoise() {
  const w = Math.max(1, Math.ceil(glass.clientWidth / 3)), h = Math.max(1, Math.ceil(glass.clientHeight / 3));
  if (w === nw && h === nh) return;
  nw = nc.width = w; nh = nc.height = h; img = nx.createImageData(nw, nh); buf = new Uint32Array(img.data.buffer); drawNoise();
}
function drawNoise() { for (let i = 0; i < buf.length; i++) { const v = 100 + (Math.random() * 155 | 0); buf[i] = 0xff000000 | (v << 16) | (v << 8) | v; } nx.putImageData(img, 0, 0); }

/* text turns to noise when the signal is weak */
const GLYPHS = "ABCDEFGHKLMNPRSTUVXYZ#%&*+=/\\|:;.·";
const nodesOf = el => { const out = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) if (n.data.trim()) out.push([n, n.data]); return out; };
STATIONS.forEach(s => { s.nodes = nodesOf(s.el); });
let scrambled = false;
function scramble(p) {
  if (!current || (p <= 0 && !scrambled)) return; // already clean: don't touch the DOM
  scrambled = p > 0;
  for (const [n, o] of current.nodes) n.data = p <= 0 ? o : o.replace(/\S/g, c => Math.random() < p ? GLYPHS[Math.random() * GLYPHS.length | 0] : c);
}

/* ---------- sound: built in code on the first knob turn, faded in and out, never autoplays ----------
   static  = pink noise through a 250 Hz–3.2 kHz "speaker" band, with a faint hiss floor so a locked station still sounds alive
   whistle = the heterodyne you hear just off a station: a sine whose pitch rises with distance, loudest half-way in
   purr    = a 70–450 Hz rumble (audible on laptop and phone speakers) pulsed at 25 Hz and breathing slowly, only on the unlisted station */
let ac, master, gNoise, gOsc, osc, gPurr, soundOn = false, sleepT;
const snd = $("snd");
function buildAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  ac = new AC();
  const sr = ac.sampleRate, len = sr * 3, nb = ac.createBuffer(1, len, sr), d = nb.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .25; }
  const fade = 256; for (let i = 0; i < fade; i++) d[len - fade + i] = d[len - fade + i] * (1 - i / fade) + d[i] * (i / fade); // seamless loop
  const gain = v => { const n = ac.createGain(); n.gain.value = v; return n; };
  const filt = (type, f, q) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -10; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = .003; lim.release.value = .2; // safety limiter
  master = gain(0); master.connect(lim); lim.connect(ac.destination);
  const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
  const hp = filt("highpass", 250, .7), lp = filt("lowpass", 3200, .7);
  gNoise = gain(0); src.connect(hp); hp.connect(lp); lp.connect(gNoise); gNoise.connect(master);
  osc = ac.createOscillator(); osc.type = "sine"; osc.frequency.value = 220;
  gOsc = gain(0); osc.connect(gOsc); gOsc.connect(master);
  const php = filt("highpass", 70, .7), plp = filt("lowpass", 450, .7), pulse = gain(.5), breath = gain(.65); gPurr = gain(0);
  const lfo = ac.createOscillator(), lfoD = gain(.5); lfo.frequency.value = 25; lfo.connect(lfoD); lfoD.connect(pulse.gain);
  const slow = ac.createOscillator(), slowD = gain(.35); slow.frequency.value = .45; slow.connect(slowD); slowD.connect(breath.gain);
  src.connect(php); php.connect(plp); plp.connect(pulse); pulse.connect(breath); breath.connect(gPurr); gPurr.connect(master);
  src.start(); osc.start(); lfo.start(); slow.start();
  return true;
}
function soundOut() { // fade the master so switching (or hiding the tab) never clicks, then let the context sleep
  if (!ac) return;
  const want = soundOn && !document.hidden, g = master.gain, t = ac.currentTime;
  clearTimeout(sleepT);
  if (want && ac.state !== "running") ac.resume();
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(want ? 1 : 0, t + (want ? .3 : .12));
  if (!want) sleepT = setTimeout(() => { if (!(soundOn && !document.hidden)) ac.suspend(); }, 200);
}
snd.addEventListener("click", () => {
  soundOn = !soundOn;
  if (soundOn && !ac && !buildAudio()) soundOn = false; // no Web Audio: the knob just stays off
  snd.setAttribute("aria-pressed", soundOn); soundOut();
});
document.addEventListener("visibilitychange", soundOut);
function audio(sig, s) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime, d = Math.min(Math.abs(freq - s.f), BAND * 1.5);
  gNoise.gain.setTargetAtTime(.012 + (1 - sig) ** 1.4 * .2, t, .05);
  gOsc.gain.setTargetAtTime(4 * sig * (1 - sig) * .05, t, .05);
  osc.frequency.setTargetAtTime(220 + d * 38, t, .05);
  gPurr.gain.setTargetAtTime(s.secret ? sig * 1.5 : 0, t, .25);
}

/* ---------- the loop (time-based, so 60/120Hz screens feel the same; stops while the tab is hidden) ---------- */
let frame = 0, last = 0, raf = 0, wSig = "", wNoise = "", wX = "";
function show(s) {
  if (current === s) return;
  if (current) { scramble(0); current.el.classList.remove("on"); current.leg && current.leg.classList.remove("live"); }
  current = s; s.el.classList.add("on"); s.leg && s.leg.classList.add("live"); prog.scrollTop = 0;
}
function loop(now) {
  const n = last ? Math.min(4, (now - last) / 16.667) : 1; last = now; frame++;
  if (!dragging) {
    if (target != null) { freq += (target - freq) * (RM ? 1 : 1 - Math.pow(.89, n)); if (Math.abs(target - freq) < .04) { freq = target; target = null; } }
    else if (vel) { freq = clamp(freq + vel * n); vel *= Math.pow(.93, n); if (Math.abs(vel) < .25 || freq === LO || freq === HI) { vel = 0; detent(); } }
  }
  const sig = signalOf(freq), s = nearest(freq);
  show(s);
  const jit = !RM && sig < .9 ? (Math.random() - .5) * (1 - sig) * 3 : 0;
  const x = (cx - (freq - LO) * k + jit).toFixed(1), sg = sig.toFixed(3), no = (RM ? .05 + (1 - sig) * .5 : .06 + (1 - sig) * .78).toFixed(3);
  if (x !== wX) { strip.style.transform = `translate3d(${x}px,0,0)`; wX = x; }  // only write what changed: an idle dial costs nothing
  if (sg !== wSig) { root.style.setProperty("--sig", sg); wSig = sg; }
  if (no !== wNoise) { root.style.setProperty("--noise", no); wNoise = no; }
  if (!RM && (sig < .985 || frame % 8 === 0)) drawNoise();
  if (!RM && frame % 4 === 0) scramble(sig >= .985 ? 0 : (1 - sig) ** .8);
  if (sig >= .985 && locked !== s) { locked = s; live.textContent = `Tuned to ${s.secret ? "an unlisted station" : s.name}, ${s.f} kHz`; }
  else if (sig < .985) locked = null;
  audio(sig, s);
  raf = requestAnimationFrame(loop);
}
function start() { if (!raf && !document.hidden) { last = 0; raf = requestAnimationFrame(loop); } }
document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else start(); });
const onRM = () => { RM = rmq.matches; scramble(0); };
rmq.addEventListener ? rmq.addEventListener("change", onRM) : rmq.addListener(onRM);

if (window.ResizeObserver) new ResizeObserver(measure).observe(glass); else addEventListener("resize", measure);
if (document.fonts) { document.fonts.ready.then(measure); document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", measure); } // re-fit names once the dial face arrives
measure();
glass.classList.add("cold"); void glass.offsetWidth;                                     // the valves warm up
requestAnimationFrame(() => requestAnimationFrame(() => glass.classList.remove("cold")));
if (!RM) setTimeout(() => { if (!moved && !dragging) target = HOME.f; }, 900);
start();
</script>
</body>
</html>
