<body>
<h1 class="sr">Daksh Jain</h1>

<p class="hint" id="hint">Tap a card to read it. Drag across the felt to deal them your own way.</p>

<div class="held" id="held" hidden>
  <button class="step" id="prev" type="button" aria-label="Previous card">&lsaquo;</button>
  <button id="putback" type="button">Put it back</button>
  <span class="links" id="links" hidden></span>
  <button class="step" id="next" type="button" aria-label="Next card">&rsaquo;</button>
</div>

<ul class="index" id="index" aria-label="Pick up a card"></ul>

<div class="bar">
  <nav class="tools" aria-label="The deck">
    <button id="turn" type="button">Turn over</button>
    <button id="shuffle" type="button">Shuffle</button>
    <button id="sound" type="button" aria-pressed="true">Sound</button>
  </nav>
  <div class="maker" id="maker"></div>
</div>

<div class="sr" id="live" aria-live="polite"></div>
<section class="flat" id="flat" aria-label="Every card, laid flat"></section>
