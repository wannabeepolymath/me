<html lang="en">
<head>

<title>Daksh Jain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='3' fill='%23fbf9f4'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='Georgia' fill='%23c4182c'%3EJ%3C/text%3E%3C/svg%3E">
<meta name="description" content="Daksh Jain, jack of all trades. His website is a deck of cards: pick one.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --felt: #5e1527;
    --felt-deep: #1d0509;
    --gold: #dcb96e;
    --stock: #fbf9f4;
    --ink: #161311;
    --red: #c4182c;
    --ultra: #1f3d9c;
    --ivory: #f3ead7;
    --graphite: #5d5a55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 45% 40%, var(--felt) 0%, #3a0c17 55%, var(--felt-deep) 100%);
    color: var(--ivory);
    font: 400 16px/1.5 Literata, Georgia, serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas.table { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  button, a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* bottom bar: deck tools left, maker's address right */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    padding: 0 24px max(20px, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .tools { display: flex; gap: 8px; }
  .tools button, .held button {
    font: 600 14px/1 Literata, Georgia, serif; letter-spacing: .01em;
    color: var(--ink); background: var(--ivory);
    border: 0; border-radius: 3px; padding: 11px 14px 12px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,.5), 0 8px 18px -6px rgba(0,0,0,.6);
    transition: transform .12s ease, background-color .12s ease;
  }
  .tools button:hover, .held button:hover { background: #fff; transform: translateY(-1px); }
  .tools button:active, .held button:active { transform: translateY(1px); }
  .tools button[aria-pressed="false"] { background: transparent; color: var(--ivory); box-shadow: inset 0 0 0 1px rgba(243,234,215,.45); }
  .maker { text-align: right; font-size: 15px; line-height: 1.45; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .maker .lead { font-style: italic; opacity: .82; }
  .maker a { color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .maker a:hover { color: #f1d699; }
  .maker .row { display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap; }

  .hint {
    position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 2;
    margin: 0; font-style: italic; font-size: 15px; color: var(--ivory); opacity: .78;
    text-shadow: 0 1px 8px rgba(0,0,0,.7); white-space: nowrap; pointer-events: none;
    transition: opacity .6s ease;
  }
  .hint.gone { opacity: 0; }

  /* while a card is held up */
  .held {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 4;
    display: flex; gap: 8px; align-items: center;
  }
  .held[hidden] { display: none; }
  .held button { white-space: nowrap; }
  .held .step { width: 42px; padding-left: 0; padding-right: 0; font-size: 18px; }
  .held .links { display: flex; gap: 8px; }
  .held .links[hidden] { display: none; }
  .held .links a {
    font: 600 14px/1 Literata, Georgia, serif; color: var(--ivory); text-decoration: none;
    padding: 11px 12px 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(220,185,110,.8); background: rgba(29,5,9,.55);
  }
  .held .links a:hover { background: rgba(29,5,9,.85); }

  /* keyboard index: each card is a button that appears only while focused */
  .index { list-style: none; margin: 0; padding: 0; }
  .index button {
    position: fixed; left: 50%; top: 18px; z-index: 5; transform: translate(-50%, -160%);
    font: 600 15px/1.2 Literata, Georgia, serif; color: var(--ink); background: var(--ivory);
    border: 0; border-radius: 3px; padding: 10px 14px; white-space: nowrap;
  }
  .index button:focus { transform: translate(-50%, 0); }
  .index button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* the deck laid flat: screen readers always, everyone when WebGL is unavailable */
  .flat { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .nogl canvas.table, .nogl .hint, .nogl .tools, .nogl .index { display: none; }
  .nogl { overflow: auto; display: flex; flex-direction: column; min-height: 100%; }
  .nogl .flat { order: 1; }
  .nogl .bar { order: 2; position: static; padding-top: 8px; padding-bottom: 32px; }
  .nogl .flat {
    position: static; width: auto; height: auto; overflow: visible; clip-path: none;
    padding: 40px 24px 24px; max-width: 1200px; margin: 0 auto; width: 100%;
  }
  .flat h2 { font: 400 clamp(40px, 7vw, 76px)/1 "Rozha One", Georgia, serif; color: var(--gold); margin: 0 0 6px; }
  .flat > p { margin: 0 0 28px; max-width: 60ch; font-style: italic; }
  .flat ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .flat li {
    background: var(--stock); color: var(--ink); border-radius: 12px; padding: 18px 18px 22px; aspect-ratio: 5 / 7;
    box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 14px 26px -12px rgba(0,0,0,.7); overflow: hidden;
  }
  .flat .ix { font: 400 30px/1 "Rozha One", Georgia, serif; }
  .flat .ix.red { color: var(--red); }
  .flat h3 { font: 400 26px/1.1 "Rozha One", Georgia, serif; margin: 14px 0 8px; }
  .flat h3 small { display: block; font: italic 400 14px/1.3 Literata, Georgia, serif; margin-bottom: 4px; }
  .flat li p { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
  .flat .pencil { font-family: "Reenie Beanie", cursive; font-size: 22px; color: var(--graphite); line-height: 1.1; }
  .flat li a { color: var(--red); }

  @media (max-width: 760px) {
    .bar { flex-direction: column-reverse; align-items: stretch; gap: 10px; padding: 0 16px max(14px, env(safe-area-inset-bottom)); }
    .maker { text-align: left; font-size: 14px; }
    .maker .row { justify-content: flex-start; }
    .tools button { padding: 10px 11px 11px; font-size: 13px; }
    .hint { top: 14px; font-size: 14px; white-space: normal; width: calc(100% - 32px); text-align: center; }
    .held { bottom: 118px; }
    .held .links a { padding: 10px 9px 11px; font-size: 13px; }
  }
  @media (max-width: 560px) { .flat li { aspect-ratio: auto; } }
  @media (prefers-reduced-motion: reduce) {
    .tools button, .held button, .hint { transition: none; }
  }
</style>

<p class="hint" id="hint">Tap a card to read it. Drag across the felt to deal them your own way.</p>

  <button class="step" id="prev" type="button" aria-label="Previous card">&lsaquo;</button>
  <button id="putback" type="button">Put it back</button>

<script>
/* ============================================================
   EDIT ME. Everything Daksh might change lives in this object.
   Any text that starts with "[fill" is drawn in pencil, like the
   blank cards a new deck comes with. Replace it and it prints.
   Cards are dealt in this order. suit: spades | hearts | diamonds | clubs
   ============================================================ */
window.DAKSH = {
  name: 'Daksh Jain',
  email: 'dakshjainn2004@gmail.com',
  github: 'https://github.com/wannabeepolymath',
  x: 'https://x.com/dakshhjainn',
  cards: [
    { rank: 'joker', trade: 'wildcard', title: 'Daksh Jain',
      body: 'Lives in Bangalore. Online he goes by wannabeepolymath. Every other card here is a trade he has picked up.',
      note: '[fill: one line about you, in your own words]' },
    { rank: 'J', suit: 'diamonds', trade: 'Bangalore',
      body: 'Where he lives.',
      note: '[fill: the corner of the city you would send a friend to]' },
    { rank: 'J', suit: 'clubs', trade: 'studies',
      body: 'Computer science at BITS Pilani. A bachelor’s and a master’s, through 2027.' },
    { rank: 'J', suit: 'spades', trade: 'systems',
      body: 'A WebSocket multiplexer in Rust. A Redis clone in Go. Backends for AI agents at Emergent.' },
    { rank: 'J', suit: 'spades', trade: 'small apps',
      body: 'Parla, voice dictation for the Mac. Burmese, a pet that lives on your desktop. A Solana game inside Telegram.' },
    { rank: 'J', suit: 'hearts', trade: '[fill: a trade]',
      body: '[fill: something you make that is not code]' },
    { rank: 'J', suit: 'clubs', trade: '[fill: a trade]',
      body: '[fill: what you are reading, and why]' },
    { rank: 'J', suit: 'hearts', trade: '[fill: a trade]',
      body: '[fill: the music on repeat right now]' },
    { rank: 'J', suit: 'diamonds', trade: '[fill: a trade]',
      body: '[fill: a place you would go back to]' },
    { rank: 'J', suit: 'clubs', trade: '[fill: a trade]',
      body: '[fill: what you are learning now, and how it is going]' },
    { rank: 'A', suit: 'spades', trade: 'the maker' }
  ]
};

/* ---- plain-HTML parts: maker's address, keyboard index, the flat deck (also the no-WebGL fallback) ---- */
(function () {
  const D = window.DAKSH;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isFill = (s) => typeof s === 'string' && s.startsWith('[fill');
  const para = (s) => s ? `<p${isFill(s) ? ' class="pencil"' : ''}>${esc(s)}</p>` : '';
  const pip = { spades: '♠︎', hearts: '♥︎', diamonds: '♦︎', clubs: '♣︎' };
  const gh = D.github.replace(/^https?:\/\//, ''), xx = D.x.replace(/^https?:\/\//, '');
  window.cardLabel = (c) => c.rank === 'joker' ? `The joker: ${D.name}` : c.rank === 'A' ? 'The ace of spades: how to reach Daksh' : `Jack of ${isFill(c.trade) ? 'a trade still to be written' : c.trade}`;

  document.getElementById('maker').innerHTML =
    `<div class="lead">Write to Daksh</div><div class="row"><a href="mailto:${esc(D.email)}">${esc(D.email)}</a><a href="${esc(D.github)}" target="_blank" rel="noopener">GitHub</a><a href="${esc(D.x)}" target="_blank" rel="noopener">X</a></div>`;

  document.getElementById('index').innerHTML = D.cards.map((c, i) =>
    `<li><button type="button" data-i="${i}">${esc(window.cardLabel(c))}. Press Enter to pick it up</button></li>`).join('');

  document.getElementById('flat').innerHTML = `<h2>${esc(D.name)}</h2><p>Jack of all trades. His deck, laid flat.</p><ol>` +
    D.cards.map((c) => {
      const red = c.suit === 'hearts' || c.suit === 'diamonds' || c.rank === 'joker';
      const ix = c.rank === 'joker' ? 'Joker' : `${c.rank} ${pip[c.suit]}`;
      if (c.rank === 'A') return `<li><div class="ix">${ix}</div><h3><small>The maker’s card</small>Write to Daksh</h3>
        <p><a href="mailto:${esc(D.email)}">${esc(D.email)}</a></p><p><a href="${esc(D.github)}">${esc(gh)}</a></p><p><a href="${esc(D.x)}">${esc(xx)}</a></p></li>`;
      const kicker = c.rank === 'joker' ? 'The wildcard' : 'Jack of';
      const title = c.rank === 'joker' ? c.title : isFill(c.trade) ? c.trade : c.trade.charAt(0).toUpperCase() + c.trade.slice(1);
      return `<li><div class="ix${red ? ' red' : ''}">${ix}</div><h3><small>${kicker}</small>${isFill(title) ? `<span class="pencil">${esc(title)}</span>` : esc(title)}</h3>${para(c.body)}${para(c.note)}</li>`;
    }).join('') + '</ol>';

  // if three.js never arrives (offline CDN, blocked script), show the flat deck
  window.__glTimer = setTimeout(() => { if (!document.body.classList.contains('gl')) document.body.classList.add('nogl'); }, 9000);
})();
</script>

<script type="module">
import * as THREE from 'three';

const D = window.DAKSH;
const N = D.cards.length;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isFill = (s) => typeof s === 'string' && s.startsWith('[fill');
const $ = (id) => document.getElementById(id);
const fail = () => { clearTimeout(window.__glTimer); document.body.classList.add('nogl'); };

/* ---------------- palette + type ---------------- */
const STOCK = '#fbf9f4', INK = '#161311', RED = '#c4182c', GOLD = '#dcb96e', ULTRA = '#1f3d9c', IVORY = '#f3ead7', YEL = '#e7b230', GRAPHITE = '#5d5a55';
const ROZHA = '"Rozha One", Georgia, serif', LIT = 'Literata, Georgia, serif', PEN = '"Reenie Beanie", "Comic Sans MS", cursive';
const suitColor = (s) => (s === 'hearts' || s === 'diamonds' || s === 'joker') ? RED : INK;

/* ---------------- renderer (bail to the flat deck if WebGL is missing) ---------------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (e) { fail(); throw e; }
renderer.domElement.className = 'table';
renderer.domElement.setAttribute('aria-hidden', 'true');
document.body.prepend(renderer.domElement);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

try {
  await Promise.race([
    Promise.all(['400 100px "Rozha One"', '400 40px Literata', 'italic 400 40px Literata', '600 40px Literata', '400 60px "Reenie Beanie"'].map((f) => document.fonts.load(f))),
    new Promise((r) => setTimeout(r, 3500))
  ]);
} catch (e) { /* draw with fallbacks */ }

/* ---------------- canvas helpers ---------------- */
const SMALL = Math.min(screen.width, screen.height) < 600;
const TS = SMALL ? 0.72 : 1;               // texture scale
const CW = 1024, CH = 1434;                 // card face in "design pixels" (2.5 x 3.5 in)
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function font(g, px, fam, style = '') { g.font = `${style} ${px}px ${fam}`.trim(); }
function wrap(g, text, maxW) {
  const out = []; let cur = '';
  for (const w of text.split(/\s+/)) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
function fit(g, text, maxW, px, fam, style = '') { font(g, px, fam, style); const w = g.measureText(text).width; if (w > maxW) { px = Math.floor(px * maxW / w); font(g, px, fam, style); } return px; }

/* suit pips drawn as shapes (glyphs vary by platform) — centred, unit height */
function heartAt(g, x, y, s, up = false) {
  g.save(); g.translate(x, y); g.scale(s, up ? -s : s);
  const a = 0.6407, h2 = Math.SQRT2;
  g.beginPath(); g.moveTo(0, 0.5); g.lineTo(-a / h2, 0.5 - a / h2); g.lineTo(0, 0.5 - a * h2); g.lineTo(a / h2, 0.5 - a / h2); g.closePath(); g.fill();
  for (const sx of [-1, 1]) { g.beginPath(); g.arc(sx * a / (2 * h2), 0.5 - 3 * a / (2 * h2), a / 2, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
function stem(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(-0.03, 0.06); g.quadraticCurveTo(0, 0.38, -0.24, 0.5); g.lineTo(0.24, 0.5); g.quadraticCurveTo(0, 0.38, 0.03, 0.06); g.closePath(); g.fill();
  g.restore();
}
function pip(g, suit, x, y, s) {
  if (suit === 'hearts') heartAt(g, x, y, s);
  else if (suit === 'spades') { heartAt(g, x, y - s * 0.1, s * 0.8, true); stem(g, x, y, s); }
  else if (suit === 'clubs') {
    for (const [dx, dy] of [[0, -0.27], [-0.25, 0.04], [0.25, 0.04]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, 0.225 * s, 0, Math.PI * 2); g.fill(); }
    stem(g, x, y, s);
  } else if (suit === 'diamonds') {
    g.beginPath(); g.moveTo(x, y - 0.5 * s);
    g.quadraticCurveTo(x + 0.1 * s, y - 0.14 * s, x + 0.38 * s, y); g.quadraticCurveTo(x + 0.1 * s, y + 0.14 * s, x, y + 0.5 * s);
    g.quadraticCurveTo(x - 0.1 * s, y + 0.14 * s, x - 0.38 * s, y); g.quadraticCurveTo(x - 0.1 * s, y - 0.14 * s, x, y - 0.5 * s); g.fill();
  } else { // star for the joker
    g.beginPath(); for (let i = 0; i < 10; i++) { const r = (i % 2 ? 0.2 : 0.5) * s, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); g.fill();
  }
}

/* ---------------- card faces ---------------- */
const FX = 220, FY = 70, FW = 584, FH = 1294; // the court frame
function drawIndex(g, c) {
  const col = suitColor(c.rank === 'joker' ? 'joker' : c.suit);
  g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  if (c.rank === 'joker') {
    font(g, 66, ROZHA); [...'JOKER'].forEach((ch, i) => g.fillText(ch, 100, 136 + i * 70));
    pip(g, 'joker', 100, 520, 92);
    return;
  }
  font(g, 168, ROZHA); g.fillText(c.rank, 100, 196);
  pip(g, c.suit, 100, 292, 96);
  // the trade, written down the spine so a spread reads like a list
  g.save(); g.translate(92, 380); g.rotate(Math.PI / 2); g.textAlign = 'left'; g.textBaseline = 'middle';
  if (isFill(c.trade)) { font(g, 66, PEN); g.fillStyle = GRAPHITE; }
  else { font(g, 54, LIT, 'italic'); g.fillStyle = col; }
  g.fillText(c.rank === 'A' ? 'the maker' : c.trade, 0, 0);
  g.restore();
}
function textBlock(g, text, x, y, maxW, px, lh, maxY) {
  if (!text) return y;
  if (isFill(text)) { font(g, Math.round(px * 1.5), PEN); g.fillStyle = GRAPHITE; lh *= 1.02; }
  else { font(g, px, LIT); g.fillStyle = INK; }
  for (const line of wrap(g, text, maxW)) { if (y > maxY) break; g.fillText(line, x, y); y += lh; }
  return y;
}
function drawHalf(g, c) { // frame-local coordinates, top half (above the diagonal)
  const col = suitColor(c.rank === 'joker' ? 'joker' : c.suit);
  // costume band, in court-card colours
  g.fillStyle = YEL; g.fillRect(0, 0, FW, 50);
  for (let x = 22, i = 0; x < FW; x += 44, i++) {
    g.fillStyle = i % 2 ? RED : ULTRA;
    g.beginPath(); g.moveTo(x, 9); g.lineTo(x + 13, 25); g.lineTo(x, 41); g.lineTo(x - 13, 25); g.closePath(); g.fill();
  }
  g.fillStyle = INK; g.fillRect(0, 50, FW, 4);
  const pad = 40, maxW = FW - pad * 2;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let y = 128;
  font(g, 44, LIT, 'italic'); g.fillStyle = col; g.fillText(c.rank === 'joker' ? 'The wildcard' : 'Jack of', pad, y);
  y += 106;
  const title = c.rank === 'joker' ? c.title : c.trade;
  if (isFill(title)) { fit(g, title, maxW, 104, PEN); g.fillStyle = GRAPHITE; }
  else { fit(g, title.charAt(0).toUpperCase() + title.slice(1), maxW, 104, ROZHA); g.fillStyle = INK; }
  g.fillText(isFill(title) ? title : title.charAt(0).toUpperCase() + title.slice(1), pad - 4, y);
  y += 34; g.fillStyle = col; g.fillRect(pad, y, 76, 6); y += 70;
  y = textBlock(g, c.body, pad, y, maxW, 38, 50, 548);
  textBlock(g, c.note, pad, y + 12, maxW, 38, 50, 560);
}
const ACE_LINKS = []; // uv rectangles on the ace that act as links
function drawFace(c) {
  const cv = canvas(CW * TS, CH * TS), g = cv.getContext('2d');
  g.scale(TS, TS);

  out.forEach((c, k) => later(k * 30, () => Object.assign(c.t, { x: at.x, z: at.z, yaw: near(yaw, c.p.yaw), y0: BASE + k * T, bend: 0 })));
  order = out;
  await wait(N * 30 + 520);
  busy = false;
  deal(P, { dur: 1000, flipOnLay: faceUp ? 0 : Math.PI });
}

/* ---------------- camera framing ---------------- */
const tmpV = new THREE.Vector3();
let holdDist = 8, holdUp = 0;
function frame() {
  const L = LAYOUT[mode];
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = L.fov; camera.updateProjectionMatrix();
  const [x0, x1, z0, z1] = L.box, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const e = THREE.MathUtils.degToRad(L.elev), yw = THREE.MathUtils.degToRad(L.yaw), dir = new THREE.Vector3(Math.sin(yw) * Math.cos(e), Math.sin(e), Math.cos(yw) * Math.cos(e));
  const reserve = (innerWidth < 760 ? 128 : 76) / innerHeight * 2;
  const corners = [[x0, z0], [x1, z0], [x0, z1], [x1, z1]];
  let lo = 2, hi = 200;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    camera.position.set(cx, 0, cz).addScaledVector(dir, mid); camera.lookAt(cx, 0, cz); camera.updateMatrixWorld();
    const ok = corners.every(([x, z]) => { tmpV.set(x, 0, z).project(camera); return Math.abs(tmpV.x) <= 0.97 && tmpV.y <= 0.96 && tmpV.y >= -0.97 + reserve; });
    if (ok) hi = mid; else lo = mid;
  }
  // nudge so the reserved strip sits under the table, not over it
  camera.position.set(cx, 0, cz).addScaledVector(dir, hi); camera.lookAt(cx, 0, cz);
  camera.updateMatrixWorld();
  const th = Math.tan(THREE.MathUtils.degToRad(L.fov / 2));
  holdDist = Math.max(H / (0.66 * 2 * th), W / (0.8 * 2 * th * camera.aspect));
  holdUp = holdDist * th * (innerWidth < 760 ? 0.13 : 0.07); // lift the held card clear of the buttons
}
function setPrint() {
  const L = LAYOUT[mode], [x0, x1, z0, z1] = L.rect;
  if (printMat.map) printMat.map.dispose();
  printMat.map = drawPrint(L); printMat.needsUpdate = true;
  print.scale.set(x1 - x0, 1, z1 - z0); print.position.set((x0 + x1) / 2, 0.001, (z0 + z1) / 2);
}
frame(); setPrint();

/* ---------------- pointer: hover, pick, drag a card, or draw a spread ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let ptr = { x: 0, y: 0 }, press = null, drag = null;
function setNdc(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ptr.x = ndc.x; ptr.y = ndc.y; ray.setFromCamera(ndc, camera); }
function hitCard() { const h = ray.intersectObjects(meshes, false)[0]; return h ? { c: h.object.userData.card, h } : null; }
function onTable() { const p = new THREE.Vector3(); return ray.ray.intersectPlane(tablePlane, p) ? p : null; }
function aceLink(h) {
  if (!h || h.object !== h.object.userData.card.face || h.object.userData.card.data.rank !== 'A' || !h.uv) return null;
  return ACE_LINKS.find((l) => h.uv.x >= l.u0 && h.uv.x <= l.u1 && h.uv.y >= l.v0 && h.uv.y <= l.v1) || null;
}
function firstTouch() { audio(); if (!touched) { touched = true; } }
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', (e) => {
  firstTouch(); setNdc(e);
  if (busy) return;
  const hit = hitCard();
  if (picked) {
    if (hit && hit.c === picked) { const l = aceLink(hit.h); if (l) { openLink(l.href); return; } }
    putBack(); return;
  }
  cvs.setPointerCapture(e.pointerId);
  const p = onTable();
  press = { x: e.clientX, y: e.clientY, t: performance.now(), hit, p, id: e.pointerId };
});
function openLink(href) { if (href.startsWith('mailto:')) location.href = href; else window.open(href, '_blank', 'noopener'); }
cvs.addEventListener('pointermove', (e) => {
  setNdc(e);
  if (press && !drag && !sweep?.manual) {
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 7) {
      const p = onTable(); if (!p) return;
      if (press.hit) { // slide one card around with a fingertip
        const c = press.hit.c, top = Math.max(...cards.map((o) => o.p.y0));
        drag = { c, r: { x: c.p.x - press.p.x, z: c.p.z - press.p.z }, yaw0: c.p.yaw, w: 0, last: p.clone(), at: p.clone(), vel: { x: 0, z: 0 }, tl: performance.now() };
        c.free = true; c.t.y0 = top + T; c.t.lift = 0.32; hovered = null; sfx.lift();
      } else { // gather the deck into your hand and deal along your stroke
        const now = performance.now();
        sweep = { P: makePath([new THREE.Vector2(press.p.x, press.p.z)]), hand: 0, laid: 0, manual: true };
        order.forEach((c, k) => { c.gatherAt = now + k * 14; c.free = false; c.t.slide = 0; c.t.bend = 0; });
        $('hint').classList.add('gone'); sfx.swish(0.4);
      }
    }
  }
  if (drag) {
    const p = onTable(); if (!p) return;
    const now = performance.now(), dt = Math.max(1, now - drag.tl) / 1000;
    drag.vel.x = drag.vel.x * 0.6 + ((p.x - drag.last.x) / dt) * 0.4; drag.vel.z = drag.vel.z * 0.6 + ((p.z - drag.last.z) / dt) * 0.4;
    drag.last.copy(p); drag.at.copy(p); drag.tl = now;
  } else if (sweep?.manual) {
    const p = onTable(); if (!p) return;
    const pts = sweep.P.pts, last = pts[pts.length - 1], v = new THREE.Vector2(p.x, p.z);
    if (v.distanceTo(last) > 0.07) { pts.push(v); sweep.P = makePath(pts); sweep.hand = sweep.P.len; }
  } else if (!press && !picked && e.pointerType === 'mouse') {
    const hit = hitCard();
    hovered = hit && !busy ? hit.c : null;
    cvs.style.cursor = hovered ? 'pointer' : 'grab';
  } else if (picked) {
    const hit = hitCard();
    cvs.style.cursor = hit && hit.c === picked && aceLink(hit.h) ? 'pointer' : 'default';
  }
});
function release(e) {
  if (!press) return;
  if (drag) {
    const c = drag.c, sp = Math.min(14, Math.hypot(drag.vel.x, drag.vel.z)), k = sp > 0 ? 0.16 * sp / Math.hypot(drag.vel.x, drag.vel.z) : 0;
    c.t.x = c.p.x + (drag.vel.x || 0) * k; c.t.z = c.p.z + (drag.vel.z || 0) * k; c.t.yaw = c.p.yaw + drag.w * 0.12; c.t.lift = 0;
    for (const key of ['x', 'z']) c.v[key] = 0;
    later(140, () => sfx.lay());
    drag = null;
  } else if (sweep?.manual) {
    finishSweep();
  } else if (press.hit && performance.now() - press.t < 600) {
    pickUp(press.hit.c);
  }
  press = null;
}
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('pointerleave', () => { if (!press) hovered = null; });

/* ---------------- buttons + keys ---------------- */
$('turn').addEventListener('click', () => { audio(); turnOver(); });
$('shuffle').addEventListener('click', () => { audio(); shuffle(); });
$('sound').addEventListener('click', (e) => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.textContent = soundOn ? 'Sound' : 'Sound off'; if (soundOn) audio(); });
$('putback').addEventListener('click', () => putBack());
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
if (!matchMedia('(hover: none)').matches) $('hint').textContent = 'Click a card to read it. Drag across the felt to deal them your own way.';
$('links').innerHTML = `<a href="mailto:${D.email}">Email</a><a href="${D.github}" target="_blank" rel="noopener">GitHub</a><a href="${D.x}" target="_blank" rel="noopener">X</a>`;
document.querySelectorAll('#index button').forEach((b) => {
  const c = cards[+b.dataset.i];
  b.addEventListener('focus', () => { focused = c; });
  b.addEventListener('blur', () => { if (focused === c) focused = null; });
  b.addEventListener('click', () => { audio(); pickUp(c); });
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && picked) { putBack(); e.preventDefault(); }
  else if (picked && e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  else if (picked && e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
});

addEventListener('resize', () => {
  const m = innerWidth >= innerHeight ? 'land' : 'port';
  if (m !== mode) {
    mode = m; setPrint();
    if (!busy && !sweep && (!lastLayout || !lastLayout.user)) { const P = defaultPath(), h = (N - 1) * (P.gap || USER_GAP); layoutAlong(P, h, Infinity); lastLayout = { P, hand: h, user: false }; }
  }
  frame();
});

/* ---------------- frame loop ---------------- */
const qT = new THREE.Quaternion(), qC = new THREE.Quaternion(), qFace = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
const qTilt = new THREE.Quaternion(), eul = new THREE.Euler(), pT = new THREE.Vector3(), pC = new THREE.Vector3(), fwd = new THREE.Vector3();
let last = performance.now(), invite = 0;
function tick(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;

  if (sweep) {
    if (sweep.auto) {
      const u = Math.min(1, (now - sweep.auto.t0) / sweep.auto.dur);
      sweep.hand = sweep.auto.to * (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    }
    const laid = layoutAlong(sweep.P, sweep.hand, now, sweep.flipOnLay);
    if (laid > sweep.laid) { for (let i = sweep.laid; i < laid; i++) sfx.lay((i - sweep.laid) * 0.012); sweep.laid = laid; }
    if (sweep.auto && now - sweep.auto.t0 >= sweep.auto.dur) finishSweep();
  }

  // a nudge from the joker until someone touches the deck
  if (!touched && !RM && !busy && !sweep && faceUp && now - invite > 3400) {
    invite = now; const j = order.find((c) => c.data.rank === 'joker'); if (j && !picked) j.v.slide += 5.5;
  }

  camera.getWorldDirection(fwd);
  pC.copy(camera.position).addScaledVector(fwd, holdDist).addScaledVector(tmpV.set(0, 1, 0).applyQuaternion(camera.quaternion), holdUp);
  qTilt.setFromEuler(eul.set(-ptr.y * 0.16, ptr.x * 0.22, 0));
  qC.copy(camera.quaternion).multiply(qTilt).multiply(qFace);

  for (const c of cards) {
    c.t.slide = (c === hovered ? 0.42 : 0) + (c === focused ? 0.7 : 0);
    if (drag && drag.c === c) {
      // card trails behind the fingertip and swings round its grab point
      const rx = drag.r.x, rz = drag.r.z, dy = c.p.yaw - drag.yaw0, cs = Math.cos(dy), sn = Math.sin(dy);
      const r = { x: rx * cs + rz * sn, z: -rx * sn + rz * cs }, rl = Math.hypot(r.x, r.z);
      if (rl > 0.2) drag.w += ((r.x * drag.vel.z - r.z * drag.vel.x) / rl) * 1.25 * dt;
      drag.w *= Math.exp(-5 * dt);
      c.p.yaw += drag.w * dt; c.t.yaw = c.p.yaw; c.v.yaw = 0;
      c.p.x = c.t.x = drag.at.x + r.x; c.p.z = c.t.z = drag.at.z + r.z; c.v.x = c.v.z = 0;
      drag.vel.x *= Math.exp(-6 * dt); drag.vel.z *= Math.exp(-6 * dt);
    }
    for (const k in SP) {
      if (RM) { c.p[k] = c.t[k]; c.v[k] = 0; continue; }
      const [K, Z] = SP[k], C = 2 * Math.sqrt(K) * Z;
      c.v[k] += (K * (c.t[k] - c.p[k]) - C * c.v[k]) * dt; c.p[k] += c.v[k] * dt;
    }
    const u = THREE.MathUtils.clamp(c.p.up, 0, 1.04);
    const sn = Math.sin(c.p.yaw), cs = Math.cos(c.p.yaw);
    pT.set(c.p.x + sn * c.p.slide, c.p.y0 + c.p.lift + (W / 2) * Math.abs(Math.sin(c.p.flip)), c.p.z + cs * c.p.slide);
    qT.setFromEuler(eul.set(0, c.p.yaw, c.p.flip, 'YZX'));
    if (u > 0.0005) {
      c.group.position.lerpVectors(pT, pC, Math.min(u, 1));
      c.group.position.y += Math.sin(Math.PI * Math.min(u, 1)) * 1.6;
      c.group.quaternion.slerpQuaternions(qT, qC, Math.min(u, 1));
    } else { c.group.position.copy(pT); c.group.quaternion.copy(qT); }
    bendGeo(c, c.p.bend + Math.sin(Math.PI * Math.min(u, 1)) * 0.2 + (drag && drag.c === c ? 0.05 : 0));
    c.face.castShadow = u < 0.35; // a card held up to your eye shouldn't throw a slab of shadow
    c.faceMat.emissiveIntensity = 0.05 + 0.82 * Math.min(u, 1) + (c === focused ? 0.12 : 0);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------------- opening: deck squared, then dealt in one sweep, then turned ---------------- */
document.body.classList.add('gl'); clearTimeout(window.__glTimer);
const P0 = defaultPath(), s0 = pathAt(P0, 0), d0 = pathDir(P0, 0.01);
cards.forEach((c, k) => Object.assign(c.p, { x: s0.x, z: s0.z, yaw: Math.atan2(-d0.z, d0.x), y0: BASE + k * T }) && Object.assign(c.t, c.p));
if (RM) {
  const h0 = (N - 1) * (P0.gap || USER_GAP);
  layoutAlong(P0, h0, Infinity); faceUp = true; cards.forEach((c) => (c.t.flip = 0));
  lastLayout = { P: P0, hand: h0, user: false };
} else {
  setTimeout(() => deal(P0, { dur: 1150 }), 450);
  setTimeout(() => turnOver(), 1850);
}
requestAnimationFrame((t) => { last = t; tick(t); });
</script>
