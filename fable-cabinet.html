<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daksh Jain — a cabinet of curiosities</title>
<meta name="description" content="Daksh Jain keeps a cabinet of curiosities. Walk the shelves, lift any glass.">
<meta name="theme-color" content="#0E2620">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230E2620%27/%3E%3Cpath d=%27M9 25V14a7 7 0 0 1 14 0v11z%27 fill=%27none%27 stroke=%27%23EADFC8%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%276%27 r=%271.6%27 fill=%27%23EADFC8%27/%3E%3Cpath d=%27M7 26h18%27 stroke=%27%238F5F3C%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --lacquer:#0E2620; --lacquer-hi:#174237; --ceiling:#06120E; --wainscot:#1B120C;
  --wood:#4A2E1B; --wood-2:#66422A; --wood-hi:#8F5F3C; --wood-dk:#2A1A0F;
  --bone:#EADFC8; --bone-2:#D9CBAD; --ink:#24170F; --ink-soft:#4B3A2C;
  --verdigris:#5FB39A; --oxblood:#7E2F2A; --brass:#C8A456; --lamp:#FFE7B8;
  --jar: clamp(92px, 16svh, 172px);
  --tier1: 37%; --tier2: 64%;          /* shelf board tops, % of room height */
  --wallbot: 73%;                       /* where the wall meets the floor */
  --board: 1.6svh;
  --fell: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --sans: 'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ceiling);color:var(--bone)}
body{font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--verdigris);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- the room ---------- */
.room{position:fixed;inset:0;height:100dvh;overflow:hidden;background:var(--ceiling);
  --sl:0; --rx:0;}
.room::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.65), transparent 14%, transparent 86%, rgba(0,0,0,.65)),
    linear-gradient(180deg, rgba(0,0,0,.55), transparent 18%, transparent 80%, rgba(0,0,0,.6));}
.floor{position:absolute;left:-30%;right:-30%;top:var(--wallbot);height:70%;z-index:0;
  transform-origin:50% 0;transform:perspective(72svh) rotateX(63deg);
  background:
    linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.25) 35%, rgba(0,0,0,0) 70%),
    repeating-linear-gradient(90deg, var(--wood-dk) 0 2px, var(--wood) 2px 170px, var(--wood-2) 170px 171px, var(--wood) 171px 300px);
  background-position: 0 0, calc(var(--sl) * -1px) 0;}
.floor::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg, transparent 0 44px, rgba(0,0,0,.22) 44px 45px);}
.ceiling{position:absolute;left:0;right:0;top:0;height:9%;background:linear-gradient(180deg,#040B09,var(--ceiling));z-index:0}
.dust{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen}

/* ---------- the hall (scrolls in x) ---------- */
.hall{position:absolute;inset:0;z-index:2;display:flex;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;outline-offset:-4px}
.hall::-webkit-scrollbar{display:none}
.hall.dragging{cursor:grabbing;user-select:none}
.sec{position:relative;flex:none;height:100%;width:calc(var(--jar) * (var(--n, 0) * 1.42 + .58));
  background:
    linear-gradient(180deg, transparent 0 9%, var(--lacquer-hi) 9%, var(--lacquer) 22%, var(--lacquer) 60%, #0B1F1A var(--wallbot), transparent var(--wallbot)),
    linear-gradient(180deg, transparent 0 60%, var(--wainscot) 60% var(--wallbot), transparent var(--wallbot));
  background-blend-mode:normal;}
.sec::before{content:"";position:absolute;inset:9% 0 27% 0;pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 198px, rgba(255,255,255,.035) 198px 200px, transparent 200px 320px, rgba(0,0,0,.18) 320px 322px);}
/* wainscot rail */
.sec::after{content:"";position:absolute;left:0;right:0;top:60%;height:1.2svh;
  background:linear-gradient(180deg, var(--wood-hi), var(--wood) 55%, var(--wood-dk));box-shadow:0 2px 6px rgba(0,0,0,.6);}
.wood{position:absolute;left:0;right:0;height:var(--board);
  background:linear-gradient(180deg, var(--wood-hi), var(--wood) 45%, var(--wood-dk));
  box-shadow:0 .6svh 1.2svh rgba(0,0,0,.55), 0 -1px 0 rgba(255,255,255,.08) inset;}
.wood.t1{top:var(--tier1)} .wood.t2{top:var(--tier2)}
.wood::after{content:"";position:absolute;left:0;right:0;top:100%;height:3.2svh;
  background:linear-gradient(180deg, rgba(0,0,0,.45), transparent);}
.row{position:absolute;z-index:1;left:0;display:flex;align-items:flex-end;gap:calc(var(--jar) * .42);padding:0 calc(var(--jar) * .5)}
.row.t1{bottom:calc(100% - var(--tier1))} .row.t2{bottom:calc(100% - var(--tier2))}

/* lamp sconce on the wall */
.lamp{position:absolute;top:7.5%;width:calc(var(--jar) * 6);left:0;height:60%;pointer-events:none;
  background:radial-gradient(ellipse 60% 70% at 50% 0%, rgba(255,231,184,.34), rgba(255,231,184,.10) 45%, transparent 70%);
  opacity:0;transform-origin:50% 0;}
.lamp::before{content:"";position:absolute;top:1.2%;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #fff8e6, var(--lamp) 40%, #B78C4A 100%);
  box-shadow:0 0 10px 3px rgba(255,231,184,.9), 0 0 36px 10px rgba(255,231,184,.45);}
.lamp::after{content:"";position:absolute;top:0;left:50%;width:28px;height:10px;margin-left:-14px;border-radius:0 0 14px 14px;
  background:linear-gradient(180deg, #2b1c10, #6A452A);}
.lit .lamp{animation:light 1.1s ease-out forwards;animation-delay:calc(var(--i) * .32s)}
@keyframes light{0%{opacity:0}35%{opacity:.5}50%{opacity:.2}100%{opacity:1}}

/* section plate on the shelf front */
.plate{position:absolute;top:9.6%;left:calc(var(--jar) * .5);z-index:1;
  font:italic clamp(13px,1.9svh,17px)/1.1 var(--fell);color:#F6E7B9;letter-spacing:.01em;
  padding:.28em .7em .3em;border-radius:2px;white-space:nowrap;
  background:linear-gradient(180deg,#8D6E3A,#5E4420 60%,#4A3418);
  box-shadow:0 1px 0 rgba(255,235,190,.35) inset, 0 2px 4px rgba(0,0,0,.6);}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff2cc,#7a5a25);}
.plate::before{left:4px} .plate::after{right:4px}

/* ---------- jars ---------- */
.jar{position:relative;flex:none;width:var(--jar);height:calc(var(--jar) * 1.22);border:0;padding:0;background:none;
  cursor:pointer;color:var(--bone);-webkit-tap-highlight-color:transparent;border-radius:12px}
.jar:focus-visible{outline:none}
.jar:focus-visible .cloche{box-shadow:0 0 0 3px var(--verdigris), inset 0 0 0 1px rgba(255,255,255,.3), inset -10px -8px 24px rgba(0,0,0,.3)}
.plinth{position:absolute;left:5%;right:5%;bottom:0;height:9%;border-radius:3px 3px 2px 2px;
  background:linear-gradient(180deg,var(--wood-hi),var(--wood) 55%,var(--wood-dk));
  box-shadow:0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.08) inset;}
.spec{position:absolute;left:13%;right:13%;bottom:9%;height:66%;overflow:visible;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.spec svg{width:100%;height:100%;display:block;overflow:visible}
.cloche{position:absolute;left:3%;right:3%;top:3%;bottom:8%;
  border-radius:48% 48% 7% 7% / 38% 38% 4% 4%;
  background:
    linear-gradient(104deg, rgba(255,255,255,.26) 0 5%, rgba(255,255,255,0) 13% 42%, rgba(255,255,255,.08) 52%, rgba(255,255,255,0) 58% 88%, rgba(255,255,255,.22) 96%),
    linear-gradient(180deg, rgba(214,240,255,.16), rgba(190,225,225,.04) 55%, rgba(255,255,255,.10));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.26), inset -10px -8px 24px rgba(0,0,0,.3), inset 8px 10px 20px rgba(255,255,255,.06), 0 12px 22px -8px rgba(0,0,0,.6);
  backdrop-filter:blur(.7px) saturate(1.15) brightness(1.06);-webkit-backdrop-filter:blur(.7px) saturate(1.15) brightness(1.06);
  transform-origin:8% 100%;transition:transform .62s cubic-bezier(.3,.9,.3,1.04), box-shadow .2s;}
.cloche::before{content:"";position:absolute;top:-7%;left:50%;width:14%;aspect-ratio:1;margin-left:-7%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(214,240,255,.25) 55%, rgba(255,255,255,.08));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}
.cloche::after{content:"";position:absolute;top:7%;bottom:12%;width:7%;left:calc(16% + var(--rx) * 1%);border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 70%, transparent);
  filter:blur(1px);}
.jar:hover .cloche{box-shadow:inset 0 0 0 1px rgba(255,255,255,.42), inset -10px -8px 24px rgba(0,0,0,.3), 0 0 24px -4px rgba(255,231,184,.35), 0 12px 22px -8px rgba(0,0,0,.6)}
.jar.open{z-index:3}
.jar.open .cloche{transform:translateY(-50%) rotate(-8deg)}
.jar .tag{position:absolute;top:calc(100% + var(--board) + 1.4svh);left:50%;transform:translateX(-50%) rotate(var(--tilt,-1deg));
  font:italic clamp(12px,1.9svh,15px)/1.1 var(--fell);color:var(--ink);background:var(--bone);
  padding:.28em .6em .32em;border-radius:2px;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.08);}
.jar .tag::before{content:"";position:absolute;left:50%;top:-1.6svh;height:1.6svh;width:1px;background:rgba(234,223,200,.5)}
.jar .tag::after{content:"";position:absolute;left:50%;top:-2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--oxblood)}
.jar.pending .spec{opacity:.55}
.jar.pending .tag{font-style:italic;color:var(--ink-soft);background:var(--bone-2)}
.jar.open .tag{background:#fff6dd}
/* loose specimen (no glass) */
.jar.loose .cloche{display:none}
.jar.loose .spec{height:72%;bottom:9%}

/* specimen animations when the glass is up */
.open .pin{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.pin{transform-origin:58px 50px;transform-box:fill-box}
.open .cap{animation:tip 2.4s ease-in-out infinite}
@keyframes tip{50%{transform:rotate(-7deg) translateY(-2px)}}
.open .wave{animation:wave 1.4s ease-out infinite}
@keyframes wave{0%{opacity:0;transform:translateX(-4px)}30%{opacity:1}100%{opacity:0;transform:translateX(8px)}}
.open .dot{animation:flow 1.8s linear infinite}
.dot{offset-distance:0%}
.d2{animation-delay:.6s!important}.d3{animation-delay:1.2s!important}
@keyframes flow{to{offset-distance:100%}}
.open .plane{animation:fly 2.6s ease-in-out infinite}
@keyframes fly{50%{transform:translate(4px,-5px) rotate(6deg)}}
.open .dr{animation:slide 2s ease-in-out infinite}
@keyframes slide{50%{transform:translateX(6px)}}
.tail{transform-origin:66px 76px;animation:flick 3.4s ease-in-out infinite}
@keyframes flick{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-22deg)}90%{transform:rotate(10deg)}}
.eyes{animation:blink 5s steps(1) infinite}
@keyframes blink{0%,94%,100%{opacity:1}96%{opacity:0}}
.open .tail{animation-duration:1.2s}
.open .magpie{animation:peek 2.2s ease-in-out infinite}
@keyframes peek{50%{transform:translateY(-3px) rotate(-4deg)}}
.open .pages{animation:flutter 1.6s ease-in-out infinite}
@keyframes flutter{50%{transform:skewX(-6deg)}}
.open .ghost{animation:ghost 2.4s ease-in-out infinite}
@keyframes ghost{50%{opacity:.35;transform:translateY(-3px)}}

/* ---------- entrance placard ---------- */
.intro{width:min(92vw, 640px);display:flex;align-items:center}
.door{position:absolute;left:0;top:9%;bottom:27%;width:clamp(28px,5vw,64px);
  background:linear-gradient(90deg, var(--wood-dk), var(--wood) 60%, var(--wood-hi));box-shadow:4px 0 12px rgba(0,0,0,.6)}
.placard{position:relative;z-index:1;margin-left:clamp(36px,8vw,110px);margin-top:-14svh;width:min(80vw,480px);
  background:var(--bone);color:var(--ink);padding:clamp(18px,3svh,30px) clamp(18px,3vw,32px) clamp(16px,2.6svh,26px);
  border-radius:3px;transform:rotate(-.6deg);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 18px 30px -12px rgba(0,0,0,.8), 0 2px 4px rgba(0,0,0,.5);}
.placard::before{content:"";position:absolute;inset:7px;border:1px solid rgba(126,47,42,.55);border-radius:2px;pointer-events:none}
.placard::after{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff2cc,#7a5a25);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.placard h1{font:400 clamp(26px,4.6svh,44px)/1.05 var(--fell);margin:0 0 .5em;letter-spacing:-.005em;text-wrap:balance}
.placard p{margin:0 0 .75em;font-size:clamp(14px,2.1svh,16.5px);line-height:1.5;max-width:42ch;color:#2E2016}
.placard p:last-child{margin:0}
.placard .how{font:italic 1em/1.4 var(--fell);color:var(--oxblood)}
.placard a{color:var(--oxblood);text-decoration-thickness:1px;text-underline-offset:3px}
.placard a:hover{color:#4f1c18}
.intro .wood{display:block}

/* ---------- workshop corner ---------- */
.sec.shop{background:
    linear-gradient(180deg, transparent 0 9%, #16302A 9%, #122A24 22%, #122A24 60%, #0B1F1A var(--wallbot), transparent var(--wallbot)),
    linear-gradient(180deg, transparent 0 60%, var(--wainscot) 60% var(--wallbot), transparent var(--wallbot));}
.sec.shop::before{background:
  radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0/22px 22px;}
.note{position:absolute;top:calc(var(--tier1) - 22svh);right:calc(var(--jar) * .1);width:min(30ch, 44vw);
  font:italic clamp(13px,2svh,16px)/1.4 var(--fell);color:var(--ink);background:var(--bone-2);padding:.7em .9em;
  transform:rotate(1.2deg);border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.6);}
.note::after{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--oxblood);box-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ---------- visitors' book ---------- */
.book{width:100vw}
.lectern{position:absolute;z-index:1;left:50%;bottom:13%;transform:translateX(-50%);width:min(78vw,420px)}
.pages{position:relative;background:linear-gradient(90deg,#E4D7BC 0 50%, #EEE3CC 50%);color:var(--ink);
  padding:clamp(14px,2.4svh,22px) clamp(16px,3vw,28px);border-radius:4px 4px 2px 2px;transform:perspective(600px) rotateX(10deg);transform-origin:50% 100%;
  box-shadow:0 2px 0 #c9bb9c, 0 4px 0 #b9ab8c, 0 18px 24px -10px rgba(0,0,0,.8);}
.pages::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.pages h2{font:400 clamp(20px,3.2svh,28px)/1.1 var(--fell);margin:0 0 .35em}
.pages p{margin:0 0 .6em;font-size:clamp(13px,2svh,15px);max-width:40ch;color:var(--ink-soft)}
.pages ul{list-style:none;margin:0;padding:0}
.pages li{display:flex;gap:.6em;align-items:baseline;justify-content:space-between;padding:.45em 0;border-bottom:1px solid rgba(36,23,15,.22);font-size:clamp(13px,2.05svh,15.5px)}
.pages li span{font:italic 1.05em var(--fell);color:var(--ink-soft);white-space:nowrap}
.pages li a{color:var(--oxblood);text-decoration-thickness:1px;text-underline-offset:3px;overflow-wrap:anywhere;text-align:right}
.pages li a:hover{color:#4f1c18}
.stand{height:clamp(44px,9svh,80px);margin:0 18%;background:linear-gradient(90deg,var(--wood-dk),var(--wood) 30%,var(--wood-hi) 50%,var(--wood) 70%,var(--wood-dk));
  clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.drawer{margin:1.2svh auto 0;width:min(70vw,360px);
  font:italic clamp(12px,1.9svh,14.5px)/1.3 var(--fell);color:var(--bone-2);text-align:center;}
.drawer b{font-weight:400;color:#F6E7B9}
.exit{position:absolute;right:0;top:9%;bottom:27%;width:clamp(28px,5vw,64px);
  background:linear-gradient(270deg, var(--wood-dk), var(--wood) 60%, var(--wood-hi));box-shadow:-4px 0 12px rgba(0,0,0,.6)}

/* ---------- fixed furniture ---------- */
.brand{position:fixed;top:14px;left:16px;z-index:10;font:italic clamp(14px,2.1svh,17px)/1.15 var(--fell);color:var(--ink);
  background:var(--bone);padding:.35em .75em .4em;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.6);transform:rotate(-1deg);
  text-decoration:none}
.brand small{display:block;font:italic .78em/1.1 var(--fell);color:var(--ink-soft)}
.notebtn{position:fixed;top:14px;right:16px;z-index:10;font:italic clamp(14px,2.1svh,17px)/1.15 var(--fell);color:#F6E7B9;
  background:linear-gradient(180deg,#8D6E3A,#5E4420 60%,#4A3418);border:0;padding:.42em .9em .46em;border-radius:2px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,235,190,.35) inset, 0 2px 4px rgba(0,0,0,.6)}
.notebtn:hover{filter:brightness(1.12)}

.hint{position:fixed;right:18px;top:50%;z-index:10;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--bone);font:italic 14px/1.2 var(--fell);opacity:.85;pointer-events:none;transition:opacity .6s}
.hint svg{width:34px;height:34px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.hint.gone{opacity:0}

.plan{position:fixed;left:50%;bottom:14px;z-index:10;transform:translateX(-50%);display:flex;align-items:center;gap:0;
  background:rgba(20,38,31,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(234,223,200,.14);border-radius:999px;padding:4px}
.plan button{background:none;border:0;cursor:pointer;color:var(--bone-2);font:italic clamp(12px,1.7svh,14px)/1 var(--fell);
  padding:.55em .85em;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:.5em}
.plan button i{width:6px;height:6px;border-radius:50%;background:rgba(234,223,200,.35);display:inline-block}
.plan button[aria-current="true"]{color:#F6E7B9;background:rgba(234,223,200,.1)}
.plan button[aria-current="true"] i{background:var(--verdigris);box-shadow:0 0 8px var(--verdigris)}
.plan button:hover{color:#fff}
.plan .snd{border-left:1px solid rgba(234,223,200,.14);border-radius:0 999px 999px 0;margin-left:2px}

/* specimen placard */
.card{position:fixed;left:18px;bottom:62px;z-index:11;width:min(380px, calc(100vw - 36px));
  background:var(--bone);color:var(--ink);padding:18px 44px 18px 20px;border-radius:3px;transform:rotate(-.6deg) translateY(16px);opacity:0;pointer-events:none;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 18px 30px -12px rgba(0,0,0,.85), 0 2px 4px rgba(0,0,0,.5);
  transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(126,47,42,.5);border-radius:2px;pointer-events:none}
.card.on{transform:rotate(-.6deg) translateY(0);opacity:1;pointer-events:auto}
.card .k{font:italic clamp(12px,1.9svh,14px)/1.2 var(--fell);color:var(--oxblood);margin:0 0 .2em}
.card h2{font:400 clamp(20px,3.3svh,27px)/1.1 var(--fell);margin:0 0 .4em;text-wrap:balance}
.card p{margin:0;font-size:clamp(14px,2.05svh,15.5px);line-height:1.5;max-width:40ch;color:#2E2016}
.card p.fill{font:italic 1.05em/1.4 var(--fell);color:var(--ink-soft)}
.card .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;background:none;cursor:pointer;color:var(--oxblood);border-radius:50%;font:20px/1 var(--fell)}
.card .x:hover{background:rgba(126,47,42,.1)}

@media (max-width:640px){
  :root{--jar:clamp(88px,14svh,132px);--tier1:38%;--tier2:66%;--wallbot:75%}
  .brand{top:10px;left:10px}.notebtn{top:10px;right:10px}
  .hint{right:10px;top:auto;bottom:64px;transform:none;flex-direction:row;gap:8px}
  .hint svg{width:26px;height:26px}
  .pages li{flex-direction:column;align-items:flex-start;gap:.15em}
  .pages li a{text-align:left}
  .plan button[aria-current="true"] b{display:inline}
  .plan{bottom:10px;max-width:calc(100vw - 20px)}
  .plan button{padding:.5em .6em}
  .plan button b{display:none}
  .card{left:10px;right:10px;width:auto;bottom:58px;transform:rotate(0) translateY(16px)}
  .card.on{transform:none}
  .placard{margin-left:clamp(20px,6vw,60px);margin-top:-12svh;width:72vw}
  .intro{width:78vw}
  .note{width:40vw}
}
@media (prefers-reduced-motion:reduce){
  .lit .lamp{animation:none;opacity:1}
  .cloche,.card,.hint svg,.tail,.eyes{animation:none!important;transition:none!important}
  .open *{animation:none!important}
  .hall{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="room" id="room">
  <div class="ceiling"></div>
  <div class="floor" aria-hidden="true"></div>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>
  <main class="hall" id="hall" tabindex="0" aria-label="The cabinet. Scroll sideways to walk along the shelves."></main>
  <a class="brand" href="#" id="brand">Daksh Jain<small>a cabinet of curiosities</small></a>
  <button class="notebtn" id="notebtn" type="button">Leave him a note</button>
  <div class="hint" id="hint" aria-hidden="true">
    <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h20M19 10l7 7-7 7"/></svg>
    <span>scroll to walk</span>
  </div>
  <nav class="plan" id="plan" aria-label="Floor plan"></nav>
  <aside class="card" id="card" role="dialog" aria-live="polite" aria-labelledby="card-h">
    <p class="k" id="card-k"></p>
    <h2 id="card-h"></h2>
    <p id="card-p"></p>
    <button class="x" id="card-x" type="button" aria-label="Lower the glass">×</button>
  </aside>
</div>
<script>
/* =========================================================================
   EVERYTHING ABOUT DAKSH LIVES HERE. Edit this object; the room rebuilds itself.
   Jars with pending:true are things he hasn't told us yet - replace the
   "[fill: ...]" text and set pending:false (optionally pick a shape).
   ========================================================================= */
const DATA = {
  name: "Daksh Jain",
  city: "Bangalore",
  handle: "wannabeepolymath",
  contact: {
    email: "dakshjainn2004@gmail.com",
    github: "https://github.com/wannabeepolymath",
    x: "https://x.com/dakshhjainn",
  },
  resume: "[fill: link to the resume, if you want one here]",
  intro: {
    title: "Daksh Jain keeps a cabinet of curiosities.",
    body: "He studies computer science in Bangalore, builds software, and collects everything else. Every jar in this room is something he couldn't stop looking at.",
    how: "Walk along the shelves. Lift any glass.",
  },
  sections: [
    { id: "collector", plate: "I. The collector", tier1: ["habitat", "school", "handle"], tier2: ["rereads", "repeat", "place"] },
    { id: "pending",   plate: "II. Not yet collected", tier1: ["learning", "food"], tier2: ["offhours", "mystery"] },
    { id: "shop",      plate: "III. The workshop", shop: true, tier1: ["parla", "mux"], tier2: ["redis", "game", "cat"],
      note: "He also spent a while at Emergent, building the backends that AI agents run on." },
  ],
  specimens: {
    habitat:  { tag: "Habitat", shape: "globe", title: "Bangalore", text: "Where he lives. [fill: one line on what the city is to him - the weather, the traffic, the coffee, whatever he'd actually say.]" },
    school:   { tag: "Schooling", shape: "books", title: "BITS Pilani", text: "Computer science, bachelor's and master's together. Done in 2027." },
    handle:   { tag: "The handle", shape: "nest", title: "wannabeepolymath", text: "What he calls himself on GitHub. A magpie's nest of a word: one subject was never going to be enough. This room is what it looks like in practice." },
    rereads:  { tag: "awaiting specimen", shape: "book", pending: true, title: "A book he keeps re-reading", text: "[fill: the book, and why it keeps pulling him back]" },
    repeat:   { tag: "awaiting specimen", shape: "note", pending: true, title: "Music on repeat", text: "[fill: an album, an artist, a song he has worn out]" },
    place:    { tag: "awaiting specimen", shape: "mountain", pending: true, title: "A place he goes back to", text: "[fill: a city, a hill, a street, a cafe]" },
    learning: { tag: "awaiting specimen", shape: "unknown", pending: true, title: "Something he's learning that has nothing to do with computers", text: "[fill: an instrument, a language, a sport, a craft]" },
    food:     { tag: "awaiting specimen", shape: "bowl", pending: true, title: "A food he'd defend in an argument", text: "[fill: the dish, and the argument]" },
    offhours: { tag: "awaiting specimen", shape: "ball", pending: true, title: "What he does when he's not building", text: "[fill: the thing, honestly]" },
    mystery:  { tag: "awaiting specimen", shape: "unknown", pending: true, title: "Something nobody would guess about him", text: "[fill: the surprising one]" },
    parla:    { tag: "Parla", shape: "horn", title: "Parla", text: "A macOS app that types what you say. Talk at your computer; it writes it down." },
    mux:      { tag: "A multiplexer", shape: "pipes", title: "Many sockets, one line", text: "A WebSocket multiplexer written in Rust: lots of connections braided into one, and unbraided again on the way out." },
    redis:    { tag: "A Redis clone", shape: "drawers", title: "A small Redis, in Go", text: "A key-value store built from scratch to understand how the real one keeps its promises." },
    game:     { tag: "A game", shape: "coin", title: "A game inside Telegram", text: "A Telegram game that runs on Solana. Playable from a chat window." },
    cat:      { tag: "Burmese", shape: "cat", loose: true, title: "Burmese", text: "The one thing in here that isn't under glass: a desktop companion that lives at the edge of your screen and keeps you company while you work." },
  },
  book: {
    title: "Visitors' book",
    lead: "No backend here, just the three doors that reach him.",
  },
};

/* ------------------------------ specimen drawings ------------------------------ */
const S = (inner) => `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const F = 'fill="rgba(234,223,200,.12)"';
const SHAPES = {
  globe: S(`<circle cx="50" cy="44" r="26" ${F}/><ellipse cx="50" cy="44" rx="11" ry="26" stroke-opacity=".7"/><path d="M24 44h52M28 31h44M28 57h44" stroke-opacity=".7"/>
    <path d="M30 22 A 32 32 0 0 0 32 68" stroke-opacity=".35"/><path d="M50 70v12M38 86h24"/>
    <g class="pin"><path d="M58 50v-11" stroke="#B5433B"/><circle cx="58" cy="37" r="3.4" fill="#B5433B" stroke="none"/></g>`),
  books: S(`<rect x="24" y="60" width="52" height="11" rx="1.5" ${F}/><rect x="28" y="49" width="48" height="11" rx="1.5" ${F} transform="rotate(-2 52 54)"/><rect x="22" y="38" width="50" height="11" rx="1.5" ${F}/>
    <path d="M30 65h14M34 54h16M28 43h18" stroke-opacity=".55"/>
    <g class="cap"><path d="M28 26 L50 17 L72 26 L50 35 Z" ${F}/><path d="M64 29v9" /><path d="M40 30c0 6 20 6 20 0"/></g>`),
  nest: S(`<path d="M18 56c0 16 64 16 64 0" ${F}/><path d="M18 56c10-8 54-8 64 0"/><path d="M24 62l10 8M38 70l9-10M51 72l6-12M64 70l7-8M28 60l6 10" stroke-opacity=".5"/>
    <g class="magpie"><circle cx="38" cy="47" r="5"/><path d="M43 47h14M55 47v5M51 47v4"/></g><circle cx="66" cy="44" r="6"/><path d="M64 44h4M66 42v4" stroke-opacity=".7"/>
    <path d="M28 50c3-12 9-18 17-21-1 8-5 15-11 20z" ${F}/>`),
  horn: S(`<path d="M30 74h12l5-24c22-12 34-8 30-22-3-10-24-3-31 10L38 48z" ${F}/><path d="M32 74h8v6h-8z" ${F}/>
    <path class="wave" d="M70 22c6 5 6 14 0 19" stroke-opacity=".8"/><path class="wave d2" d="M80 16c10 8 10 24 0 32" stroke-opacity=".6"/>`),
  pipes: S(`<path d="M20 30c22 0 18 20 36 20h24M20 50h60M20 70c22 0 18-20 36-20" />
    <circle cx="20" cy="30" r="3.5" ${F}/><circle cx="20" cy="50" r="3.5" ${F}/><circle cx="20" cy="70" r="3.5" ${F}/><rect x="78" y="44" width="8" height="12" rx="2" ${F}/>
    <circle class="dot" r="2.6" fill="currentColor" stroke="none" style="offset-path:path('M20 30c22 0 18 20 36 20h24')"/>
    <circle class="dot d2" r="2.6" fill="currentColor" stroke="none" style="offset-path:path('M20 50h60')"/>
    <circle class="dot d3" r="2.6" fill="currentColor" stroke="none" style="offset-path:path('M20 70c22 0 18-20 36-20h24')"/>`),
  drawers: S(`<rect x="22" y="30" width="56" height="46" rx="2" ${F}/><path d="M22 45h56M22 60h56" stroke-opacity=".8"/>
    <rect class="dr" x="26" y="33" width="48" height="9" rx="1" ${F}/><circle cx="50" cy="52" r="2" fill="currentColor" stroke="none"/><circle cx="50" cy="67" r="2" fill="currentColor" stroke="none"/>
    <path d="M30 30v-6h14v6" />`),
  coin: S(`<circle cx="44" cy="54" r="19" ${F}/><circle cx="44" cy="54" r="14" stroke-opacity=".5"/><path d="M47 43l-7 11h7l-3 11 9-14h-6z" fill="currentColor" stroke="none"/>
    <path class="plane" d="M64 26l20-7-7 20-5-7z" ${F}/><path class="plane" d="M72 32l5-6" stroke-opacity=".7"/>`),
  cat: S(`<path d="M34 82h36" stroke-opacity=".5"/><path d="M38 82c-3-16 4-30 14-30s17 14 14 30" ${F}/><circle cx="52" cy="40" r="11" ${F}/>
    <path d="M43 33l-2-11 9 5M61 33l2-11-9 5" ${F}/><path class="eyes" d="M48 39h2.5M54.5 39h2.5" stroke-width="2.8"/><path d="M51 44h2" stroke-opacity=".7"/>
    <path d="M46 82v-12M58 82v-12"/><path class="tail" d="M66 76c12 0 16-10 10-18" />`),
  // pending silhouettes (dashed)
  book: S(`<g stroke-dasharray="4 4" class="ghost" stroke-opacity=".9"><path d="M28 30h40v46H28z"/><path d="M34 30v46M28 40h40" stroke-opacity=".5"/></g>`),
  note: S(`<g stroke-dasharray="4 4" class="ghost"><circle cx="38" cy="66" r="9"/><path d="M47 66V26l24-6v34"/><circle cx="62" cy="54" r="9"/></g>`),
  mountain: S(`<g stroke-dasharray="4 4" class="ghost"><path d="M18 76l20-34 12 18 10-12 22 28z"/><path d="M52 34v-14h16l-6 5 6 5h-16" stroke-opacity=".7"/></g>`),
  unknown: S(`<g stroke-dasharray="4 4" class="ghost"><path d="M36 38c0-10 8-16 16-16s14 6 14 14c0 10-12 12-12 22"/><circle cx="54" cy="70" r="2.4" fill="currentColor" stroke="none"/></g>`),
  bowl: S(`<g stroke-dasharray="4 4" class="ghost"><path d="M20 50h60c0 16-12 28-30 28S20 66 20 50z"/><path d="M42 44c-4-6 2-8-2-14M56 44c-4-6 2-8-2-14" stroke-opacity=".7"/></g>`),
  ball: S(`<g stroke-dasharray="4 4" class="ghost"><circle cx="50" cy="52" r="24"/><path d="M50 28c-12 12-12 36 0 48M50 28c12 12 12 36 0 48M26 52h48" stroke-opacity=".6"/></g>`),
};

/* ------------------------------ build the room ------------------------------ */
const hall = document.getElementById('hall');
const room = document.getElementById('room');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isFill = (s) => /\[fill:/.test(s);

function jar(id, tilt) {
  const sp = DATA.specimens[id];
  const cls = ['jar', sp.pending ? 'pending' : '', sp.loose ? 'loose' : ''].join(' ');
  return `<button class="${cls}" type="button" data-id="${id}" aria-expanded="false" aria-label="${esc(sp.title)}" style="--tilt:${tilt}deg">
    <span class="spec">${SHAPES[sp.shape] || SHAPES.unknown}</span><span class="plinth"></span><span class="cloche"></span>
    <span class="tag" aria-hidden="true">${esc(sp.tag)}</span></button>`;
}
let n = 0;
const tilt = () => ((n++ * 7) % 5) - 2.4;
const rows = (sec) => `<div class="wood t1"></div><div class="wood t2"></div>
  <div class="row t1">${sec.tier1.map((id) => jar(id, tilt())).join('')}</div>
  <div class="row t2">${sec.tier2.map((id) => jar(id, tilt())).join('')}</div>`;

let lampIndex = 0;
const lamp = (left) => `<div class="lamp" style="--i:${lampIndex++};left:${left}"></div>`;

hall.innerHTML = `
  <section class="sec intro" id="s-intro" data-name="Entrance">
    <div class="door" aria-hidden="true"></div>${lamp('calc(50% - var(--jar) * 3)')}
    <div class="placard">
      <h1>${esc(DATA.intro.title)}</h1>
      <p>${esc(DATA.intro.body)}</p>
      <p class="how">${esc(DATA.intro.how)} <a href="#s-book" class="golink">Or go straight to the visitors' book.</a></p>
    </div>
  </section>
  ${DATA.sections.map((sec) => `
  <section class="sec ${sec.shop ? 'shop' : ''}" id="s-${sec.id}" data-name="${esc(sec.plate)}" style="--n:${Math.max(sec.tier1.length, sec.tier2.length)}">
    ${lamp('calc(var(--jar) * -1)')}${lamp('calc(var(--jar) * 3.5)')}
    ${rows(sec)}<span class="plate">${esc(sec.plate)}</span>
    ${sec.note ? `<p class="note">${esc(sec.note)}</p>` : ''}
  </section>`).join('')}
  <section class="sec book" id="s-book" data-name="Visitors' book">
    ${lamp('calc(50% - var(--jar) * 3)')}
    <div class="lectern">
      <div class="pages">
        <h2>${esc(DATA.book.title)}</h2>
        <p>${esc(DATA.book.lead)}</p>
        <ul>
          <li><span>Write to him</span><a href="mailto:${esc(DATA.contact.email)}">${esc(DATA.contact.email)}</a></li>
          <li><span>See what he builds</span><a href="${esc(DATA.contact.github)}" target="_blank" rel="noopener">github.com/${esc(DATA.handle)}</a></li>
          <li><span>Say hello in public</span><a href="${esc(DATA.contact.x)}" target="_blank" rel="noopener">${esc(DATA.contact.x.replace('https://',''))}</a></li>
        </ul>
      </div>
      <div class="stand" aria-hidden="true"></div>
      <p class="drawer"><b>Papers, the dry version:</b> ${isFill(DATA.resume) ? esc(DATA.resume) : `<a href="${esc(DATA.resume)}" target="_blank" rel="noopener">resume</a>`}</p>
    </div>
    <div class="exit" aria-hidden="true"></div>
  </section>`;

/* lamps on the pending shelf glow a little dimmer: they're waiting too */
document.querySelectorAll('#s-pending .lamp').forEach((l) => (l.style.filter = 'brightness(.8)'));

/* floor plan rail */
const plan = document.getElementById('plan');
const secs = [...hall.querySelectorAll('.sec')];
plan.innerHTML = secs.map((s) => `<button type="button" data-to="${s.id}"><i></i><b>${esc(s.dataset.name)}</b></button>`).join('')
  + `<button type="button" class="snd" id="snd" aria-pressed="true" title="Glass sounds">sound on</button>`;

/* ------------------------------ walking ------------------------------ */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hint = document.getElementById('hint');
let hinted = false;
function onScroll() {
  const sl = hall.scrollLeft;
  room.style.setProperty('--sl', (sl * 0.9).toFixed(1));
  room.style.setProperty('--rx', (((sl / Math.max(1, hall.scrollWidth - hall.clientWidth)) - 0.5) * 24).toFixed(2));
  if (!hinted && sl > 40) { hinted = true; hint.classList.add('gone'); }
  const mid = sl + hall.clientWidth / 2;
  let cur = secs[0];
  for (const s of secs) if (s.offsetLeft <= mid) cur = s;
  plan.querySelectorAll('[data-to]').forEach((b) => b.setAttribute('aria-current', b.dataset.to === cur.id ? 'true' : 'false'));
}
hall.addEventListener('scroll', onScroll, { passive: true });
onScroll();

hall.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { hall.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

/* drag to walk (mouse); touch uses native scrolling */
let drag = null;
hall.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { x: e.clientX, sl: hall.scrollLeft, moved: false };
});
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 5) { drag.moved = true; hall.classList.add('dragging'); }
  if (drag.moved) hall.scrollLeft = drag.sl - dx;
});
window.addEventListener('pointerup', () => { if (drag?.moved) suppressClick = true; drag = null; hall.classList.remove('dragging'); });
let suppressClick = false;
hall.addEventListener('click', (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

window.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    if (e.target === hall || e.target === document.body) { hall.scrollBy({ left: e.key === 'ArrowRight' ? 240 : -240, behavior: reduce ? 'auto' : 'smooth' }); e.preventDefault(); }
  }
  if (e.key === 'Escape') close();
});

const goTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', inline: id === 's-intro' ? 'start' : 'center', block: 'nearest' });
plan.addEventListener('click', (e) => { const b = e.target.closest('[data-to]'); if (b) goTo(b.dataset.to); });
document.getElementById('notebtn').addEventListener('click', () => { close(); goTo('s-book'); });
document.getElementById('brand').addEventListener('click', (e) => { e.preventDefault(); close(); goTo('s-intro'); });
hall.addEventListener('click', (e) => { const a = e.target.closest('.golink'); if (a) { e.preventDefault(); goTo('s-book'); } });

/* ------------------------------ lifting the glass ------------------------------ */
const card = document.getElementById('card');
const cardK = document.getElementById('card-k'), cardH = document.getElementById('card-h'), cardP = document.getElementById('card-p');
let openJar = null;
function close() {
  if (openJar) { openJar.classList.remove('open'); openJar.setAttribute('aria-expanded', 'false'); }
  openJar = null; card.classList.remove('on');
}
function open(btn) {
  if (openJar === btn) return close();
  close();
  openJar = btn; btn.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
  const sp = DATA.specimens[btn.dataset.id];
  cardK.textContent = sp.pending ? 'Not yet collected' : btn.closest('.sec').dataset.name;
  cardH.textContent = sp.title;
  cardP.textContent = sp.text;
  cardP.className = isFill(sp.text) ? 'fill' : '';
  card.classList.add('on');
  btn.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
  if (!sp.loose) clink(); else purr();
}
hall.addEventListener('click', (e) => { const b = e.target.closest('.jar'); if (b) open(b); });
document.getElementById('card-x').addEventListener('click', () => { const j = openJar; close(); j?.focus(); });

/* ------------------------------ sound (generated) ------------------------------ */
let ac = null, soundOn = true;
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => { soundOn = !soundOn; sndBtn.textContent = soundOn ? 'sound on' : 'sound off'; sndBtn.setAttribute('aria-pressed', String(soundOn)); });
function ctx() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; } catch { return null; } }
function clink() {
  const c = soundOn && ctx(); if (!c) return;
  const t = c.currentTime;
  [[2650, 0.07, 0.28], [4100, 0.035, 0.18], [1320, 0.03, 0.4]].forEach(([f, g, d]) => {
    const o = c.createOscillator(), v = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.985, t + d);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + 0.004); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(v).connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  });
}
function purr() {
  const c = soundOn && ctx(); if (!c) return;
  const t = c.currentTime, o = c.createOscillator(), v = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(48, t);
  lfo.frequency.setValueAtTime(24, t); lg.gain.setValueAtTime(0.05, t); lfo.connect(lg).connect(v.gain);
  v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(0.06, t + 0.1); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(v).connect(c.destination); o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1);
}

/* ------------------------------ dust in the lamplight ------------------------------ */
const cv = document.getElementById('dust'), g = cv.getContext('2d');
let motes = [], W = 0, H = 0;
function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; motes = Array.from({ length: Math.round(W / 22) }, mote); }
function mote() { return { x: Math.random() * W, y: H * 0.08 + Math.random() * H * 0.67, r: Math.random() * 1.4 + .4, vx: (Math.random() - .5) * .12, vy: Math.random() * .08 + .02, a: Math.random() * Math.PI * 2 }; }
function tick() {
  g.clearRect(0, 0, W, H);
  for (const m of motes) {
    m.x += m.vx + Math.sin(m.a += .01) * .08; m.y += m.vy;
    if (m.y > H * 0.78 || m.x < -5 || m.x > W + 5) Object.assign(m, mote(), { y: H * 0.08 });
    const depth = 1 - m.y / (H * .8);
    g.fillStyle = `rgba(255,231,184,${(0.12 + depth * .35).toFixed(3)})`;
    g.beginPath(); g.arc(m.x, m.y, m.r, 0, 7); g.fill();
  }
  if (!reduce) requestAnimationFrame(tick);
}
addEventListener('resize', size); size(); tick();

/* ------------------------------ lights on ------------------------------ */
(document.fonts?.ready || Promise.resolve()).then(() => room.classList.add('lit'));
setTimeout(() => room.classList.add('lit'), 1200); // in case fonts stall
</script>
</body>
</html>
